DOCTYPE html>

<style>
body{background:#0f0f0f;color:#fff;font-family:system-ui,-apple-system,sans-serif;margin:0;padding-bottom:180px}
header{background:#d4ff3f;color:#000;padding:14px;text-align:center;font-weight:900;font-size:18px;letter-spacing:.5px;position:sticky;top:0;z-index:10}
header small{display:block;font-size:12px;font-weight:700;opacity:.7}
.wrap{max-width:600px;margin:0 auto;padding:14px}
.card{background:#1e1e1e;border:1px solid #333;border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px 0;font-size:17px}
input{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;font-size:15px}
.small{font-size:13px;opacity:.7;line-height:1.5}
.balance{font-size:28px;font-weight:900;margin:6px 0}
.balance span{font-size:14px;opacity:.7;font-weight:700}
.btn{width:100%;background:#d4ff3f;color:#000;border:0;padding:13px;border-radius:99px;font-weight:900;font-size:15px;cursor:pointer}
.btn2{width:100%;background:#222;color:#fff;border:1px solid #444;padding:12px;border-radius:99px;font-weight:800;font-size:14px;cursor:pointer}
.song{background:#1e1e1e;border:1px solid #333;border-radius:18px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.song img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#333;flex-shrink:0}
.song .meta{flex:1;min-width:0}
.song .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:6px;margin-top:9px}
.row button{flex:1;padding:10px;border-radius:99px;border:1px solid #444;background:#222;color:#fff;font-weight:800;font-size:13px;cursor:pointer}
.row button.play{background:#d4ff3f;color:#000;border-color:#d4ff3f}
.row button.share{flex:0 0 42px}
.player{position:fixed;left:10px;right:10px;bottom:72px;background:#1e1e1e;border:1px solid #d4ff3f;border-radius:18px;padding:10px;display:none;gap:10px;align-items:center;z-index:50}
.player.show{display:flex}
.player img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#333}
.player .meta{flex:1;min-width:0}
.player .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.player .meta span{font-size:12px;opacity:.7}
.player button{background:#d4ff3f;color:#000;border:0;width:42px;height:42px;border-radius:99px;font-weight:900;font-size:18px;cursor:pointer;flex-shrink:0}
.player button.stop{background:#333;color:#fff}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex;justify-content:space-around;padding:10px 0;z-index:40}
.bottomnav a{color:#fff;text-decoration:none;font-size:11px;font-weight:700;text-align:center;opacity:.65;line-height:1.3}
.bottomnav a.active{color:#d4ff3f;opacity:1}
.top-links{display:flex;gap:8px;margin-top:10px}
.top-links a{flex:1;text-align:center;background:#222;border:1px solid #333;color:#fff;text-decoration:none;padding:10px;border-radius:99px;font-size:13px;font-weight:800}
.top-links a.green{background:#d4ff3f;color:#000;border-color:#d4ff3f}
</style>
</head>
