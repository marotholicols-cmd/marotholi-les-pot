<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Marotholi Les-Pot</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="wrap"><div class="card center"><h1>MAROTHOLI <span style="color:#d4ff3f">LES-POT</span></h1><p>Login to buy & earn</p></div>
<div class="card"><label>Email</label><input id="email" type="email" placeholder="you@email.com"><label>Password</label><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button><a class="link" href="#" onclick="register()">Create Account</a><p id="msg" class="small center"></p></div></div>

</body>
</html>
