<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account - Marotholi Les-Pot</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8ff00">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</head>
<body>
<div class="topbar"><div class="logo">MAROTHOLI <span>LES-POT</span></div><a class="badge" href="wallet.html" id="topBal">0 Grinds</a></div>
<div class="wrap">
  <div class="card" id="loggedOut">
    <h2>👤 Login / Sign Up</h2>
    <p class="small" style="margin-top:6px">You need an account to buy songs and top up wallet.</p>
    <label>Email</label><input id="email" type="email" placeholder="you@gmail.com">
    <label>Password</label><input id="password" type="password" placeholder="Min 6 characters">
    <button onclick="doSignup()">Create Account</button>
    <button class="ghost" onclick="doLogin()">Log In</button>
    <p class="small center" style="margin-top:10px" id="authMsg"></p>
  </div>
  <div class="card hidden" id="loggedIn">
    <h2>✅ Logged In</h2>
    <p class="small" style="margin-top:8px" id="userEmail"></p>
    <p style="margin-top:10px">Balance: <b id="myBal" style="color:#d4ff3f">0 Grinds</b></p>
    <button onclick="location.href='wallet.html'">Go To Wallet →</button>
    <button class="ghost" onclick="logoutUser()">Log Out</button>
  </div>
</div>
<nav class="bottomnav"><a href="index.html">🏠<br>Home</a><a href="discover.html">🎵<br>Discover</a><a href="wallet.html">👛<br>Wallet</a><a href="upload.html">⬆️<br>Upload</a><a href="auth.html" class="active">👤<br>Account</a></nav>
<script>
const U="https://mmkxiniybctmgoozaecp.supabase.co"; const K="sb_publishable_wWhjXCZ4JWfGlCIG95kzPg_WXqzfVDP";
if(!window.sb && window.supabase) window.sb=window.supabase.createClient(U,K);
async function doSignup(){
  const e=document.getElementById('email').value.trim(), p=document.getElementById('password').value;
  if(!e||!p) return alert('Enter email + password');
  const {error}=await sb.auth.signUp({email:e,password:p});
  if(error) return alert(error.message);
  alert('Account created! Now log in.'); doLogin();
}
async function doLogin(){
  const e=document.getElementById('email').value.trim(), p=document.getElementById('password').value;
  const {error}=await sb.auth.signInWithPassword({email:e,password:p});
  if(error) return alert(error.message);
  location.reload();
}
document.addEventListener('DOMContentLoaded', async ()=>{
  const {user,profile}=await getMyProfile();
  if(user){
    document.getElementById('loggedOut').classList.add('hidden');
    document.getElementById('loggedIn').classList.remove('hidden');
    document.getElementById('userEmail').textContent=user.email;
    if(profile){ document.getElementById('myBal').textContent=(profile.grind_balance||0)+' Grinds'; document.getElementById('topBal').textContent=(profile.grind_balance||0)+' Grinds'; }
  }
});
</script>
</body>
</html>
