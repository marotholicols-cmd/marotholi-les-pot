<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - Marotholi Les-Pot</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
    * { box-sizing: border-box; }
  body { background: #0f0f0f; color: #fff; font-family: system-ui, sans-serif; margin: 0; padding: 20px; }
  .wrap { max-width: 420px; margin: 0 auto; }
  .logo { background: #d4ff3f; color: #000; padding: 18px; border-radius: 20px; text-align: center; font-weight: 900; font-size: 20px; margin-bottom: 16px; }
  .card { background: #1e1e1e; border: 1px solid #333; border-radius: 18px; padding: 16px; }
  label { display: block; font-size: 14px; opacity: .8; margin: 10px 0 4px; }
  input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #333; background: #111; color: #fff; font-size: 15px; }
  .small { font-size: 13px; opacity: .7; line-height: 1.5; }
  .center { text-align: center; }
  .btn { width: 100%; background: #d4ff3f; color: #000; border: 0; padding: 13px; border-radius: 99px; font-weight: 900; cursor: pointer; margin-top: 12px; }
  .btn-dark { width: 100%; background: #222; color: #fff; border: 1px solid #444; padding: 11px; border-radius: 99px; font-weight: 800; cursor: pointer; margin-top: 8px; }
  .choice { display: flex; gap: 8px; margin-bottom: 10px; }
  .choice button { flex: 1; padding: 11px; border-radius: 99px; border: 1px solid #333; background: #111; color: #fff; font-weight: 900; cursor: pointer; }
  .choice button.on { background: #d4ff3f; color: #000; border-color: #d4ff3f; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">MAROTHOLI LES-POT 🔥<br><span style="font-size:12px;font-weight:700">LESOTHO MUSIC • ARTIST SETS OWN PRICE</span></div>
  <div class="card">
    <div class="choice">
      <button id="btnLogin" class="on" onclick="setMode('login')">Login</button>
      <button id="btnSignup" onclick="setMode('signup')">Sign Up</button>
    </div>
    <div id="signupNameBox" class="hidden">
      <label>Username / Artist Name</label>
      <input id="authUsername" placeholder="e.g. FlackoBird">
    </div>
    <label>Email</label>
    <input id="authEmail" type="email" placeholder="you@email.com">
    <label>Password</label>
    <input id="authPass" type="password" placeholder="••••••••">
    <button class="btn" id="authBtn" onclick="doAuth()">LOGIN →</button>
    <p id="authMsg" class="small center"></p>
    <p class="small center">By signing up you agree: only upload YOUR OWN copyright music. 1G = M10.</p>
  </div>
  <button class="btn-dark" onclick="location.href='discover.html'">🔥 Browse without login →</button>
</div>
<script>
  let MODE = 'login';
  function setMode(m) {
    MODE = m;
    document.getElementById('btnLogin').classList.toggle('on', m === 'login');
    document.getElementById('btnSignup').classList.toggle('on', m === 'signup');
    document.getElementById('signupNameBox').classList.toggle('hidden', m !== 'signup');
    document.getElementById('authBtn').textContent = m === 'login' ? 'LOGIN →' : 'SIGN UP →';
  }
  async function doAuth() {
    const email = document.getElementById('authEmail').value.trim();
    const pass = document.getElementById('authPass').value;
    const name = document.getElementById('authUsername').value.trim();
    const msg = document.getElementById('authMsg');
    if (!email || !pass) { msg.textContent = 'Enter email + password'; return; }
    if (pass.length < 6) { msg.textContent = 'Password must be 6+ chars'; return; }
    msg.textContent = 'Loading...';
    if (MODE === 'signup') {
      const u = await signUp(email, pass, name || email.split('@')[0]);
      if (u) { msg.textContent = '✅ Signed up! Check email if needed, then login.'; setMode('login'); }
      else msg.textContent = '';
    } else {
      const u = await signIn(email, pass);
      if (u) { location.href = 'discover.html'; }
      else msg.textContent = '';
    }
  }
  document.addEventListener('DOMContentLoaded', async function () {
    const { data: { user } } = await window.sb.auth.getUser();
    if (user) location.href = 'discover.html';
  });
</script>
</body>
</html>
