<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discover - Marotholi Les-Pot</title>
<link rel="icon" href="icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="player.js"></script>
<link rel="stylesheet" href="style.css">
<style>
body{background:#0f0f0f;color:#fff;font-family:system-ui,-apple-system,sans-serif;margin:0;padding-bottom:180px}
header{background:#d4ff3f;color:#000;padding:14px;text-align:center;font-weight:900;font-size:18px;position:sticky;top:0;z-index:10}
header small{display:block;font-size:12px;font-weight:700;opacity:.7}
.wrap{max-width:600px;margin:0 auto;padding:14px}
.card{background:#1e1e1e;border:1px solid #333;border-radius:18px;padding:14px;margin-bottom:12px}
input,select{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;font-size:15px;margin-bottom:8px}
.small{font-size:13px;opacity:.7;line-height:1.5}
.btn{width:100%;background:#d4ff3f;color:#000;border:0;padding:13px;border-radius:99px;font-weight:900;font-size:15px;cursor:pointer}
.song{background:#1e1e1e;border:1px solid #333;border-radius:18px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.song img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#333;flex-shrink:0}
.song .meta{flex:1;min-width:0}
.song .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:6px;margin-top:9px}
.row button{flex:1;padding:10px;border-radius:99px;border:1px solid #444;background:#222;color:#fff;font-weight:800;font-size:13px;cursor:pointer}
.row button.play{background:#d4ff3f;color:#000;border-color:#d4ff3f}
.row button.share{flex:0 0 42px}
.player{position:fixed;left:10px;right:10px;bottom:72px;background:#1e1e1e;border:1px solid #d4ff3f;border-radius:18px;padding:10px;display:none;gap:10px;align-items:center;z-index:50}
.player.show{display:flex}
.player img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#333}
.player .meta{flex:1;min-width:0}
.player .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.player .meta span{font-size:12px;opacity:.7}
.player button{background:#d4ff3f;color:#000;border:0;width:42px;height:42px;border-radius:99px;font-weight:900;font-size:18px;cursor:pointer;flex-shrink:0}
.player button.stop{background:#333;color:#fff}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex;justify-content:space-around;padding:10px 0;z-index:40}
.bottomnav a{color:#fff;text-decoration:none;font-size:11px;font-weight:700;text-align:center;opacity:.65;line-height:1.3}
.bottomnav a.active{color:#d4ff3f;opacity:1}
</style>
</head>
<body>
<header>MAROTHOLI LES-POT<small>🎵 Discover • Preview 30s • Buy Full</small></header>
<div class="wrap">
<div class="card">
<input id="search" placeholder="Search songs, artists..." oninput="loadDiscover()">
<select id="genreFilter" onchange="loadDiscover()">
<option value="">All Genres</option><option>Hip Hop</option><option>Amapiano</option><option>Afrobeat</option><option>Sesotho</option><option>Gospel</option><option>R&B</option><option>Trap</option><option>Other</option>
</select>
<p class="small">Preview = 30 sec only • Buy = Full in Library • Share link works for everyone</p>
</div>
<div id="list"><p class="small">Loading...</p></div>
</div>
<div class="player" id="playerBar"><img id="playerCover" src="icon.svg"><div class="meta"><b id="playerTitle">No song playing</b><span id="playerArtist">Marotholi Les-Pot</span></div><button id="playerBtn" onclick="togglePlayer()">▶</button><button class="stop" onclick="stopPlayer()">✕</button></div>
<audio id="mainAudio" preload="none"></audio>
<div class="bottomnav"><a href="index.html">🏠<br>Home</a><a href="discover.html" class="active">🎵<br>Discover</a><a href="library.html">📚<br>Library</a><a href="upload.html">⬆️<br>Upload</a><a href="wallet.html">💰<br>Wallet</a><a href="account.html">👤<br>Account</a></div>
<script>
let allSongs=[];
async function loadDiscover(){
  const list=document.getElementById('list');
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  const g=document.getElementById('genreFilter').value;
  try{
    const {data,error}=await window.sb.from('songs').select('*').eq('status','published').order('created_at',{ascending:false});
    if(error) throw error;
    allSongs=data||[];
    let songs=allSongs;
    if(q) songs=songs.filter(function(s){return ((s.title||'')+' '+(s.artist_name||'')).toLowerCase().includes(q);});
    if(g) songs=songs.filter(function(s){return s.genre===g;});
    if(!songs.length){list.innerHTML="<div class='card'>No songs found. Try another search.</div>";return;}
    list.innerHTML=songs.map(function(s){
      const cover=getCoverUrl(s.cover_url||s.cover_path);
      return "<div class='song'><img src='"+cover+"' onerror=\"this.src='icon.svg'\"><div class='meta'><b>"+escHtml(s.title)+"</b><span class='small'>"+escHtml(s.artist_name)+" • "+escHtml(s.genre||'')+" • "+formatPrice(s.price_grind)+"</span><div class='row'><button class='play' onclick=\"previewSong('"+s.id+"')\">▶ Preview 30s</button><button onclick=\"buySong('"+s.id+"',"+Number(s.price_grind||0)+")\">Buy "+Number(s.price_grind||0).toFixed(2)+"G</button><button class='share' onclick=\"shareSongLink('"+s.id+"','"+escHtml(s.title)+"','"+escHtml(s.artist_name)+"')\">🔗</button></div></div></div>";
    }).join('');
  }catch(e){list.innerHTML="<div class='card'>❌ "+escHtml(e.message)+"<br><button class='btn' style='margin-top:10px' onclick='loadDiscover()'>🔄 Try Again</button></div>";}
}
async function previewSong(id){
  const s=allSongs.find(function(x){return String(x.id)===String(id);});
  if(!s) return;
  const url=await getSongStreamUrl(s.audio_path||s.audio_url,3600);
  if(!url){alert('No audio for this song');return;}
  const r=getPreviewRange(s.preview_start);
  playWithPlayer(url,s,r.start,r.end,false);
}
async function buySong(id,price){
  const user=await requireLogin(); if(!user) return;
  const {data:p}=await window.sb.from('profiles').select('balance_grind').eq('id',user.id).single();
  const bal=Number(p?.balance_grind||0);
  if(bal<price){alert('Not enough Grinds.\nYou have '+bal.toFixed(2)+' G\nNeed '+price.toFixed(2)+' G');location.href='deposit.html';return;}
  if(!confirm('Buy for '+formatPrice(price)+'? Full song goes to Library.')) return;
  const {error}=await window.sb.from('purchases').insert({buyer_id:user.id,user_id:user.id,song_id:id,price_grind:price,status:'approved'});
  if(error){alert('Buy failed: '+error.message);return;}
  await window.sb.from('profiles').update({balance_grind:bal-price}).eq('id',user.id);
  alert('✅ Bought! Go to Library for FULL song.'); location.href='library.html';
}
async function checkDeepLink(){
  const params=new URLSearchParams(location.search);
  const songId=params.get('song');
  if(!songId) return;
  await loadDiscover();
  setTimeout(function(){previewSong(songId);},600);
}
document.addEventListener('DOMContentLoaded',async function(){
  const params=new URLSearchParams(location.search);
  if(params.get('song')){await checkDeepLink();} else {await loadDiscover();}
});
</script>
</body>
</html>
