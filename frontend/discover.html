<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discover — Marotholi Les-Pot</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#d4ff3f">
</head>
<body>
<div class="topbar"><div class="logo">MAROTHOLI <span>LES-POT</span></div><span class="badge">🇱🇸 LESOTHO</span></div>
<div class="hero"><h1>New Drops.<br>Local Heat.</h1><p>Buy with Grinds. Support Lesotho artists. 1 Grind = M10</p><span class="price">🔥 TRENDING NOW</span></div>
<div class="wrap">
<div class="card">
<input id="searchInput" placeholder="🔍 Search song or artist..." oninput="filterSongs()">
<select id="genreFilter" onchange="filterSongs()"><option value="">🎵 All Genres</option><option value="Amapiano">Amapiano</option><option value="Hip Hop">Hip Hop</option><option value="Gospel">Gospel</option><option value="Afro">Afro</option><option value="House">House</option><option value="R&B">R&B</option><option value="Traditional">Traditional</option><option value="Other">Other</option></select>
<div class="flex"><span class="pill" id="songCount">Loading...</span><button class="small ghost" style="width:auto" onclick="loadSongs()">↻ Refresh</button></div>
</div>
<div id="trendingBox" class="card hidden"><h3>🔥 Trending This Week</h3><div id="trendingList"></div></div>
<div id="songList"></div>
<div id="emptyMsg" class="card center hidden"><h3>No songs found</h3><p>Try another search or genre.</p></div>
<div class="card center"><p>Want to sell your music?</p><a href="upload.html"><button>📤 Upload Your Song</button></a></div>
</div>
<div id="player"></div>
<nav class="bottomnav"><a href="discover.html" class="active">🏠<br>Discover</a><a href="library.html">📚<br>Library</a><a href="wallet.html">💰<br>Wallet</a><a href="upload.html">📤<br>Upload</a><a href="account.html">👤<br>Account</a></nav>
<script src="app.js"></script><script src="player.js"></script>
<script>
let ALL_SONGS=[];
async function loadSongs(){
  const list=document.getElementById('songList');
  list.innerHTML='<div class="card center">Loading songs...</div>';
  try{
    const songs=await window.LES_POT.getSongs();
    ALL_SONGS=songs||[];
    renderSongs(ALL_SONGS);
    renderTrending(ALL_SONGS);
  }catch(e){ list.innerHTML='<div class="card center">Failed to load. <a href="#" onclick="loadSongs()">Retry</a></div>'; }
}
function renderSongs(songs){
  const list=document.getElementById('songList');
  document.getElementById('songCount').textContent=songs.length+' songs';
  document.getElementById('emptyMsg').classList.toggle('hidden',songs.length>0);
  if(!songs.length){list.innerHTML='';return;}
  list.innerHTML=songs.map(s=>`
  <div class="card"><div class="song">
    ${s.cover_url?`<img src="${s.cover_url}">`:`<div class="coverPlaceholder">🎵</div>`}
    <div class="meta"><b>${escapeHtml(s.title||'Untitled')}</b><small>${escapeHtml(s.artist||'Unknown')} • ${escapeHtml(s.genre||'Other')} • ${s.price_grinds||1} Grinds</small><div><span class="pill">${escapeHtml(s.genre||'Other')}</span></div></div>
    <div style="text-align:right"><div class="price-tag">${s.price_grinds||1}G</div><button class="playBtn" onclick="playSong('${s.id}')">▶ Play</button></div>
  </div>
  <div class="flex" style="margin-top:12px"><button onclick="buySong('${s.id}')">🛒 Buy • ${s.price_grinds||1} Grinds</button><button class="ghost" onclick="shareSong('${escapeHtml(s.title||'') }','${s.id}')">📤 Share</button></div></div>`).join('');
}
function renderTrending(songs){
  const box=document.getElementById('trendingBox');
  if(!songs.length){box.classList.add('hidden');return;}
  const top=[...songs].sort((a,b)=>(b.plays||0)-(a.plays||0)).slice(0,3);
  box.classList.remove('hidden');
  document.getElementById('trendingList').innerHTML=top.map((s,i)=>`<div class="flex" style="padding:8px 0;border-bottom:1px solid #222"><b>#${i+1} ${escapeHtml(s.title||'')}</b><span>${escapeHtml(s.artist||'')}</span><button class="small" style="width:auto" onclick="playSong('${s.id}')">▶</button></div>`).join('');
}
function filterSongs(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  const g=document.getElementById('genreFilter').value;
  const f=ALL_SONGS.filter(s=>{const matchQ=!q||(s.title||'').toLowerCase().includes(q)||(s.artist||'').toLowerCase().includes(q);const matchG=!g||s.genre===g;return matchQ&&matchG;});
  renderSongs(f);
}
function escapeHtml(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shareSong(title,id){const url=location.origin+location.pathname.replace('discover.html','')+'discover.html?song='+id;window.open('https://wa.me/?text='+encodeURIComponent('🔥 Listen: '+title+' on LES-POT '+url));}
loadSongs();
</script>
</body>
</html>
