<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discover - Marotholi Les-Pot</title>
<link rel="icon" href="icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<link rel="stylesheet" href="style.css">
<style>
body{background:#0f0f0f;color:#fff;font-family:system-ui,-apple-system,sans-serif;margin:0;padding-bottom:180px}
header{background:#d4ff3f;color:#000;padding:14px;text-align:center;font-weight:900;font-size:18px;position:sticky;top:0;z-index:10}
header small{display:block;font-size:12px;font-weight:700;opacity:.7}
.wrap{max-width:600px;margin:0 auto;padding:14px}
.card{background:#1e1e1e;border:1px solid #333;border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px 0;font-size:17px}
input,select{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;font-size:15px}
.small{font-size:13px;opacity:.7;line-height:1.5}
.btn{width:100%;background:#d4ff3f;color:#000;border:0;padding:13px;border-radius:99px;font-weight:900;font-size:15px;cursor:pointer}
.song{background:#1e1e1e;border:1px solid #333;border-radius:18px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.song img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#333;flex-shrink:0;border:1px solid #333}
.song .meta{flex:1;min-width:0}
.song .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:6px;margin-top:9px}
.row button{flex:1;padding:10px;border-radius:99px;border:1px solid #444;background:#222;color:#fff;font-weight:800;font-size:13px;cursor:pointer}
.row button.play{background:#d4ff3f;color:#000;border-color:#d4ff3f}
.row button.share{flex:0 0 42px}
.row button.owned{background:#1a2e1a;color:#d4ff3f;border-color:#d4ff3f}
.player{position:fixed;left:10px;right:10px;bottom:72px;background:#1e1e1e;border:1px solid #d4ff3f;border-radius:18px;padding:10px;display:none;gap:10px;align-items:center;z-index:50}
.player.show{display:flex}
.player img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#333}
.player .meta{flex:1;min-width:0}
.player .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.player .meta span{font-size:12px;opacity:.7}
.player button{background:#d4ff3f;color:#000;border:0;width:42px;height:42px;border-radius:99px;font-weight:900;font-size:18px;cursor:pointer;flex-shrink:0}
.player button.stop{background:#333;color:#fff}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex;justify-content:space-around;padding:10px 0;z-index:40}
.bottomnav a{color:#fff;text-decoration:none;font-size:11px;font-weight:700;text-align:center;opacity:.65;line-height:1.3}
.bottomnav a.active{color:#d4ff3f;opacity:1}
.filters{display:flex;gap:8px;margin-top:10px}
.filters select{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{padding:8px 14px;border-radius:99px;border:1px solid #444;background:#222;color:#fff;font-size:13px;font-weight:800;cursor:pointer}
.chip.active{background:#d4ff3f;color:#000;border-color:#d4ff3f}
.count{font-size:12px;opacity:.6;margin-top:6px}
</style>
</head>
<body>
<header>MAROTHOLI LES-POT<small>🎵 Discover • 1G = M10 FIXED</small></header>
<div class="wrap">
<div class="card">
<h3>🔍 Find Music</h3>
<input id="searchInput" placeholder="Search songs, artists..." oninput="loadDiscover()">
<div class="chips" id="genreChips">
<button class="chip active" onclick="setGenre('',this)">All 🔥</button>
<button class="chip" onclick="setGenre('Hip Hop',this)">Hip Hop</button>
<button class="chip" onclick="setGenre('Amapiano',this)">Amapiano</button>
<button class="chip" onclick="setGenre('Afrobeat',this)">Afrobeat</button>
<button class="chip" onclick="setGenre('Gospel',this)">Gospel</button>
<button class="chip" onclick="setGenre('House',this)">House</button>
<button class="chip" onclick="setGenre('Famo',this)">Famo</button>
<button class="chip" onclick="setGenre('R&B',this)">R&B</button>
</div>
<div class="filters">
<select id="genreFilter" onchange="loadDiscover()" style="display:none"><option value="">All Genres</option><option>Hip Hop</option><option>Amapiano</option><option>Afrobeat</option><option>Gospel</option><option>House</option><option>Famo</option><option>R&B</option><option>Other</option></select>
<select id="sortFilter" onchange="loadDiscover()">
<option value="new">Newest First 🔥</option>
<option value="price-low">Price: Low to High 💰</option>
<option value="price-high">Price: High to Low 💎</option>
<option value="title">A - Z</option>
</select>
</div>
<p class="small" style="margin:8px 0 0 0">Preview = 30 sec only • Buy = Full song in Library • No Download • Stream Only</p>
<p class="count" id="songCount"></p>
</div>
<div id="songList"><p class="small">Loading songs...</p></div>
</div>
<div class="player" id="playerBar">
<img id="playerCover" src="icon.svg" alt="cover">
<div class="meta"><b id="playerTitle">No song playing</b><span id="playerArtist">Marotholi Les-Pot</span></div>
<button id="playerBtn" onclick="togglePlayer()">▶</button>
<button class="stop" onclick="stopPlayer()">✕</button>
</div>
<audio id="mainAudio" preload="none"></audio>
<div class="bottomnav">
<a href="index.html">🏠<br>Home</a>
<a href="discover.html" class="active">🎵<br>Discover</a>
<a href="library.html">📚<br>Library</a>
<a href="upload.html">⬆️<br>Upload</a>
<a href="wallet.html">💰<br>Wallet</a>
<a href="account.html">👤<br>Account</a>
</div>
<script>
let allSongs = [];
let ownedIds = [];
function setGenre(g,btn){
  document.getElementById('genreFilter').value=g;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  if(btn) btn.classList.add('active');
  loadDiscover();
}
function coverFor(s){
  try{
    // FIX: try cover_url FIRST (what Upload now saves), then cover_path
    const raw = s.cover_url || s.cover_path || '';
    if(!raw) return 'icon.svg';
    const c = getCoverUrl(raw);
    if(c && !String(c).includes('undefined') && !String(c).includes('null')) return c;
  }catch(e){}
  return 'icon.svg';
}
async function loadDiscover() {
  const listEl = document.getElementById('songList');
  const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  const genre = document.getElementById('genreFilter').value;
  const sort = document.getElementById('sortFilter').value;
  try {
    try{
      const u = await getCurrentUser();
      if(u){
        const {data: myP} = await window.sb.from('purchases').select('song_id').eq('fan_id', u.id).eq('status','approved');
        ownedIds = (myP || []).map(function(p){ return String(p.song_id); });
        if(!ownedIds.length){
          const r2 = await window.sb.from('purchases').select('song_id').eq('buyer_id', u.id);
          ownedIds = (r2.data||[]).map(function(p){ return String(p.song_id); });
        }
      }
    }catch(e){}
    const { data, error } = await window.sb.from('songs').select('*').eq('status', 'published').order('created_at', { ascending: false });
    if (error) throw error;
    allSongs = (data || []);
    let songs = allSongs.slice();
    if (q) songs = songs.filter(function(s) { return ((s.title || '') + ' ' + (s.artist_name || '') + ' ' + (s.artist||'')).toLowerCase().includes(q); });
    if (genre) songs = songs.filter(function(s){ return s.genre === genre; });
    if (sort === 'price-low') songs.sort(function(a,b){ return Number(a.price_grind||a.price||0) - Number(b.price_grind||b.price||0); });
    if (sort === 'price-high') songs.sort(function(a,b){ return Number(b.price_grind||b.price||0) - Number(a.price_grind||a.price||0); });
    if (sort === 'title') songs.sort(function(a,b){ return String(a.title||'').localeCompare(String(b.title||'')); });
    document.getElementById('songCount').textContent = songs.length + ' songs' + (genre ? ' • '+genre : '') + (q ? ' • "'+q+'"' : '');
    if (!songs.length) {
      listEl.innerHTML = "<div class='card'>No songs found. Try another search / genre.</div>";
      return;
    }
    listEl.innerHTML = songs.map(function(s) {
      const cover = coverFor(s);
      const owned = ownedIds.indexOf(String(s.id)) !== -1;
      const price = Number(s.price_grind||s.price||0.5);
      const buyBtn = owned
        ? "<button class='owned' onclick=\"location.href='library.html'\">✅ Owned - Play</button>"
        : "<button onclick=\"buySong('" + s.id + "', " + price + ")\">Buy " + price.toFixed(2) + "G</button>";
      const safeTitle=String(s.title||'').replace(/'/g,"");
      const safeArtist=String(s.artist_name||'').replace(/'/g,"");
      return "<div class='song'>"
        + "<img src='" + cover + "' loading='lazy' onerror=\"this.onerror=null;this.src='icon.svg'\">"
        + "<div class='meta'><b>" + escHtml(s.title) + "</b><span class='small'>" + escHtml(s.artist_name||s.artist||'') + " • " + escHtml(s.genre||'') + " • " + formatPrice(price) + (owned ? " • ✅ Owned" : "") + "</span>"
        + "<div class='row'><button class='play' onclick=\"previewSong('" + s.id + "')\">▶ Preview 30s</button>" + buyBtn + "<button class='share' onclick=\"shareSongLink('" + s.id + "','"+safeTitle+"','"+safeArtist+"')\">🔗</button></div>"
        + "</div></div>";
    }).join('');
  } catch (e) {
    listEl.innerHTML = "<div class='card'>❌ Error: " + escHtml(e.message) + "<br><button class='btn' style='margin-top:10px' onclick='loadDiscover()'>🔄 Try Again</button></div>";
  }
}
function shareById(id){
  const s = allSongs.find(function(x){ return String(x.id) === String(id); });
  if(!s) return;
  shareSongLink(s.id, s.title, s.artist_name);
}
async function previewSong(id) {
  const s = allSongs.find(function(x) { return String(x.id) === String(id); });
  if (!s) return;
  if(typeof playSong==='function'){ await playSong(s, true); return; }
  const raw=s.audio_path||s.audio_url||''; const url=await getSongStreamUrl(raw,3600);
  if(!url) return;
  const range=getPreviewRange(s.preview_start); playWithPlayer(url,s,range.start,range.end,false);
}
async function buySong(id, price) {
  const user = await requireLogin();
  if (!user) return;
  const sb=window.sb;
  const {data:already} = await sb.from('purchases').select('id').eq('fan_id', user.id).eq('song_id', id).eq('status','approved').maybeSingle();
  if(already){ alert('You already bought this - check Library'); location.href='library.html'; return; }
  const { data: p } = await sb.from('profiles').select('grind_balance').eq('id', user.id).single();
  const bal = Number(p?.grind_balance || 0);
  if (bal < price) {
    alert('Not enough Grinds.\nYou have ' + bal.toFixed(2) + ' G\nNeed ' + price.toFixed(2) + ' G\n\nGo to Deposit to top up.');
    location.href = 'deposit.html';
    return;
  }
  if (!confirm('Buy this song for ' + formatPrice(price) + '?\n\nYou will get FULL song in Library.')) return;
  const split = typeof splitMoney==='function' ? splitMoney(price) : {artist: price*0.63, fees: price*0.14};
  const { error } = await sb.from('purchases').insert({ fan_id: user.id, song_id: id, price_grind: price, fees_grind: split.fees||0, payment_method:'Wallet', status: 'approved' });
  if (error) { alert('Buy failed: ' + error.message); return; }
  await sb.from('profiles').update({ grind_balance: bal - price }).eq('id', user.id);
  try{
    const {data: songRow} = await sb.from('songs').select('user_id, artist_id').eq('id', id).single();
    const artistId = songRow?.user_id || songRow?.artist_id;
    if(artistId && String(artistId) !== String(user.id)){
      const {data: artistProf} = await sb.from('profiles').select('grind_balance').eq('id', artistId).single();
      const artistBal = Number(artistProf?.grind_balance || 0);
      await sb.from('profiles').update({ grind_balance: artistBal + split.artist }).eq('id', artistId);
    }
  }catch(e){ console.log('Artist credit failed:', e.message); }
  alert('✅ Bought! Go to Library to play FULL song.');
  location.href = 'library.html';
}
document.addEventListener('DOMContentLoaded', async function(){
  const params = new URLSearchParams(location.search);
  const songId = params.get('song');
  await loadDiscover();
  if(songId){ setTimeout(function(){ previewSong(songId); }, 500); }
});
</script>
<script src="player.js"></script>
</body>
</html>
