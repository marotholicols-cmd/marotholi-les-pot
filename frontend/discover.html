<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discover - Marotholi Les-Pot</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js" defer></script>
<style>
*{box-sizing:border-box} body{background:#0f0f0f;color:#fff;font-family:system-ui,sans-serif;margin:0}
header{background:#d4ff3f;color:#000;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:900}
header a{color:#000;text-decoration:none;font-size:13px;background:#fff;padding:6px 10px;border-radius:20px}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.search{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#222;color:#fff;margin-bottom:12px;font-size:15px}
.card{background:#1e1e1e;border:1px solid #333;padding:14px;border-radius:14px;margin-bottom:12px}
.card b{font-size:16px} .small{opacity:.7;font-size:13px}
button{padding:10px 14px;border:0;border-radius:10px;background:#d4ff3f;color:#000;font-weight:900;cursor:pointer}
button.ghost{background:#333;color:#fff}
audio{width:100%;margin-top:8px}
.nav{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.nav a{background:#222;color:#fff;text-decoration:none;padding:8px 12px;border-radius:20px;font-size:13px}
#bal{background:#000;color:#d4ff3f;padding:6px 10px;border-radius:20px;font-size:13px}
.skel{background:#222;height:110px;border-radius:14px;margin-bottom:12px;animation:pulse 1.2s infinite}
@keyframes pulse{0%{opacity:.6}50%{opacity:1}100%{opacity:.6}}
</style>
</head>
<body>
<header><span>MAROTHOLI LES-POT</span><span><span id="bal">G ...</span> <a href="wallet.html">Wallet</a></span></header>
<div class="wrap">
<div class="nav"><a href="discover.html">Discover</a><a href="library.html">Library</a><a href="wallet.html">Wallet</a><a href="upload.html">Upload</a><a href="auth.html">Logout</a></div>
<input class="search" id="searchBox" placeholder="Search song or artist..." oninput="filterSongs()">
<div id="songsList"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
<p class="small" id="statusMsg" style="text-align:center"></p>
</div>
<script>
let ALL_SONGS = [];
let OWNED_IDS = new Set();
async function loadDiscover(){
  const list = document.getElementById('songsList');
  try{
    const { data: songs, error } = await sb.from('songs').select('id,title,artist_name,artist_id,price_grind,total_buys,audio_path,audio_url,file_url,cover_url,created_at').order('created_at',{ascending:false}).limit(50);
    if(error) throw error;
    ALL_SONGS = songs || [];
    const user = await getCurrentUser().catch(()=>null);
    if(user){
      const { data: pur } = await sb.from('purchases').select('song_id').eq('fan_id', user.id).eq('status','approved');
      (pur||[]).forEach(p=>OWNED_IDS.add(p.song_id));
    }
    renderSongs(ALL_SONGS);
  }catch(e){
    list.innerHTML = '<p>Failed to load songs: '+e.message+'<br><button class="ghost" onclick="loadDiscover()">Retry</button></p>';
  }
}
function getAudio(s){
  let src = s.audio_path || s.audio_url || s.file_url || '';
  if(src && !src.startsWith('http')){
    const { data: pub } = sb.storage.from('songs').getPublicUrl(src);
    if(pub?.publicUrl) src = pub.publicUrl;
  }
  return src;
}
function renderSongs(rows){
  const list = document.getElementById('songsList');
  if(!rows.length){ list.innerHTML='<p class="small">No songs yet. Be the first to upload!</p>'; return; }
  list.innerHTML = rows.map(s=>{
    const owned = OWNED_IDS.has(s.id);
    const price = Number(s.price_grind||0);
    const audio = getAudio(s);
    return `<div class="card"><b>${escapeHtml(s.title||'Untitled')}</b><br><span class="small">${escapeHtml(s.artist_name||'Unknown')} • ${s.total_buys||0} buys • ${price} G</span>${audio?`<audio controls preload="none" src="${audio}"></audio>`:''}<br><br>${owned?`<button class="ghost" onclick="location.href='library.html'">✅ Owned - Play in Library</button>`:`<button onclick="buySongWithWallet('${s.id}', ${price}, '${s.artist_id||''}')">Buy for ${price} G</button>`}</div>`;
  }).join('');
}
function escapeHtml(t){ return String(t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function filterSongs(){
  const q = document.getElementById('searchBox').value.toLowerCase().trim();
  if(!q) return renderSongs(ALL_SONGS);
  renderSongs(ALL_SONGS.filter(s=> (s.title||'').toLowerCase().includes(q) || (s.artist_name||'').toLowerCase().includes(q)));
}
document.addEventListener('DOMContentLoaded', ()=>{ loadDiscover(); });
</script>
</body>
</html>
