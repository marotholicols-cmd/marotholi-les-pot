<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les-Pot Health Check</title>
<link rel="icon" href="icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
body{background:#0f0f0f;color:#fff;font-family:system-ui,sans-serif;margin:0;padding:16px;padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px}
.card{background:#1e1e1e;border:1px solid #333;border-radius:16px;padding:14px;margin-bottom:12px}
.ok{color:#d4ff3f;font-weight:900}
.bad{color:#ff6b6b;font-weight:900}
.warn{color:#ffcc00;font-weight:900}
.small{font-size:13px;opacity:.7;line-height:1.5}
.btn{width:100%;background:#d4ff3f;color:#000;border:0;padding:13px;border-radius:99px;font-weight:900;font-size:15px;cursor:pointer;margin-top:10px}
pre{background:#111;border:1px solid #333;border-radius:12px;padding:12px;white-space:pre-wrap;font-size:12px;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
<h1>🩺 LES-POT HEALTH CHECK</h1>
<p class="small">Checks Frontend + Backend in one go. Green = Good. Red = Fix.</p>
<div class="card"><h3>1. FRONTEND</h3><div id="front">Checking...</div></div>
<div class="card"><h3>2. BACKEND - SUPABASE</h3><div id="back">Checking...</div></div>
<div class="card"><h3>3. TABLES</h3><div id="tables">Checking...</div></div>
<div class="card"><h3>4. STORAGE + SONG TEST</h3><div id="storage">Checking...</div></div>
<div class="card"><h3>5. LOGIN</h3><div id="login">Checking...</div></div>
<button class="btn" onclick="runAll()">🔄 RUN AGAIN</button>
<a href="index.html" style="display:block;text-align:center;color:#d4ff3f;margin-top:12px;font-weight:800;text-decoration:none">← Back to Home</a>
<pre id="log">Log:\n</pre>
</div>
<script>
function log(m){ document.getElementById('log').textContent += m + "\n"; }
function line(ok,msg){ return (ok?'<span class="ok">✅ ':'<span class="bad">❌ ')+msg+'</span><br>'; }
function getSB(){ if(window.sb) return window.sb; if(typeof initSB==='function'){ try{return initSB();}catch(e){} } return window.sb||null; }

async function runAll(){
  document.getElementById('log').textContent='Log:\n';
  // 1 FRONTEND
  let f='';
  f+=line(typeof window!=='undefined','JS Running');
  f+=line(typeof initSB==='function' || !!window.sb,'app.js Loaded (initSB / sb)');
  f+=line(typeof escHtml==='function','escHtml Loaded');
  f+=line(typeof formatPrice==='function','formatPrice Loaded');
  f+=line(typeof grindToMaloti==='function','grindToMaloti Loaded');
  f+=line(typeof getSongStreamUrl==='function','getSongStreamUrl Loaded');
  document.getElementById('front').innerHTML=f;

  // 2 BACKEND
  const sb=getSB();
  if(!sb){ document.getElementById('back').innerHTML=line(false,'Supabase client NOT connected - check app.js URL/KEY'); log('No sb client'); return; }
  document.getElementById('back').innerHTML=line(true,'Supabase client connected');

  // 3 TABLES
  let t='';
  try{
    const s=await sb.from('songs').select('id').limit(1);
    t+=line(!s.error,'songs: '+(s.error?s.error.message:'OK - '+ (s.data?.length||0)+' row test'));
    if(s.error) log('songs error: '+s.error.message);
  }catch(e){ t+=line(false,'songs: '+e.message); }
  try{
    const p=await sb.from('profiles').select('id').limit(1);
    t+=line(!p.error,'profiles: '+(p.error?p.error.message:'OK'));
    if(p.error) log('profiles error: '+p.error.message);
  }catch(e){ t+=line(false,'profiles: '+e.message); }
  try{
    const pu=await sb.from('purchases').select('id').limit(1);
    t+=line(!pu.error,'purchases: '+(pu.error?pu.error.message:'OK'));
    if(pu.error) log('purchases error: '+pu.error.message);
  }catch(e){ t+=line(false,'purchases: '+e.message); }
  try{
    const d=await sb.from('deposits').select('id').limit(1);
    t+=line(!d.error,'deposits: '+(d.error?d.error.message:'OK'));
    if(d.error) log('deposits error: '+d.error.message);
  }catch(e){ t+=line(false,'deposits: '+e.message); }
  try{
    const w=await sb.from('withdrawals').select('id').limit(1);
    t+=line(!w.error,'withdrawals: '+(w.error?w.error.message:'OK'));
    if(w.error) log('withdrawals error: '+w.error.message);
  }catch(e){ t+=line(false,'withdrawals: '+e.message); }
  try{
    const e=await sb.from('eps').select('id').limit(1);
    t+=line(!e.error,'eps: '+(e.error?e.error.message:'OK'));
    if(e.error) log('eps error: '+e.error.message);
  }catch(e){ t+=line(false,'eps: '+e.message); }
  document.getElementById('tables').innerHTML=t;

  // 4 STORAGE + SONG
  let st='';
  try{
    const {data:buckets,error}=await sb.storage.listBuckets();
    if(error) st+=line(false,'Buckets: '+error.message);
    else{
      const names=(buckets||[]).map(b=>b.name+':'+(b.public?'PUBLIC':'PRIVATE'));
      st+=line(true,'Buckets: '+names.join(' | '));
      log('Buckets: '+names.join(', '));
      const songsB=buckets?.find(b=>b.name==='songs');
      const coversB=buckets?.find(b=>b.name==='covers');
      if(songsB && !songsB.public) st+=line(false,'songs bucket must be PUBLIC');
      if(coversB && !coversB.public) st+=line(false,'covers bucket must be PUBLIC');
    }
  }catch(e){ st+=line(false,'Buckets: '+e.message); }
  try{
    const {data:songs}=await sb.from('songs').select('id,title,audio_path,audio_url,cover_path,cover_url').order('created_at',{ascending:false}).limit(1);
    if(!songs?.length) st+=line(false,'No songs in DB to test - upload one');
    else{
      const s=songs[0];
      st+=line(true,'Latest song: '+s.title);
      const raw=s.audio_path||s.audio_url||'';
      if(!raw) st+=line(false,'Latest song has NO audio_path');
      else{
        const url=await getSongStreamUrl(raw,60);
        st+=line(!!url,'Stream URL: '+(url?'OK':'FAILED'));
        if(url) log('Stream URL OK for: '+raw);
        else log('Stream URL FAILED for: '+raw);
      }
    }
  }catch(e){ st+=line(false,'Song test: '+e.message); }
  document.getElementById('storage').innerHTML=st;

  // 5 LOGIN
  try{
    const user=await getCurrentUser();
    if(user) document.getElementById('login').innerHTML=line(true,'Logged in as: '+user.email+'<br>')+line(true,'User ID: '+user.id);
    else document.getElementById('login').innerHTML='<span class="warn">⚠️ Not logged in - Login works, but you are logged out. Go to Account > Login.</span>';
  }catch(e){ document.getElementById('login').innerHTML=line(false,'Auth check: '+e.message); }
  log('DONE - If all green, Les-Pot is 100%');
}
document.addEventListener('DOMContentLoaded',runAll);
</script>
</body>
</html>
