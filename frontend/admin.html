<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Marotholi Les-Pot</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
*{box-sizing:border-box} body{background:#0f0f0f;color:#fff;font-family:system-ui,sans-serif;margin:0;padding-bottom:80px}
header{background:#111;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #d4ff3f}
header b{font-size:18px} header b span{color:#d4ff3f} header a{color:#d4ff3f;text-decoration:none;font-size:13px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h3{margin:22px 0 10px;border-left:4px solid #d4ff3f;padding-left:8px}
.card{background:#1e1e1e;border:1px solid #333;padding:12px;border-radius:14px;margin-bottom:10px}
.small{opacity:.7;font-size:13px}
button{padding:10px 14px;border:0;border-radius:10px;background:#d4ff3f;color:#000;font-weight:900;cursor:pointer;margin-right:6px;margin-bottom:6px}
button.ghost{background:#333;color:#fff}
button.danger{background:#ff2d55;color:#fff}
button.blue{background:#2196f3;color:#fff}
#statusMsg{text-align:center;padding:20px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #333;background:#222;color:#fff;margin-bottom:8px;font-size:14px}
.userCard{border:1px solid #333}
.userCard b{font-size:15px}
.badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:900;background:#333}
.badge.admin{background:#d4ff3f;color:#000}
.badge.blocked{background:#ff2d55;color:#fff}
.badge.null{background:#ffaa00;color:#000}
</style>
</head>
<body>
<header><b>MAROTHOLI <span>LES-POT</span> — ADMIN</b><a href="discover.html">← Back to App</a></header>
<div class="wrap">
<div id="statusMsg">Loading admin...</div>
<div id="adminContent" style="display:none">

<!-- ✅ NEW: USERS - SEARCH + FIX NULLS + RESET PASSWORD -->
<h3>👥 Users - Find & Help</h3>
<input id="userSearch" placeholder="🔍 Search by name / phone / email..." oninput="filterUsers()">
<div class="small" style="margin-bottom:10px">Tip: If user forgot password, tap <b>Send Reset Link</b> — they get email to set new one. You never see their password.</div>
<div id="usersList"><p class="small">Loading users...</p></div>
<button class="ghost" onclick="loadUsers()">↻ Refresh Users</button>

<h3>💰 Pending Deposits</h3><div id="pendingDeposits"></div>
<h3>🏧 Pending Withdrawals</h3><div id="pendingWithdrawals"></div>
<h3>🎵 Pending Purchases</h3><div id="pendingPurchases"></div>
<h3>🎤 Recent Songs</h3><div id="pendingSongs"></div>
</div>
</div>
<script>
if(typeof sb === 'undefined' || !window.sb){
  var _sb2 = window.supabase.createClient("https://mmkxiniybctmgoozaecp.supabase.co","sb_publishable_wWhjXCZ4JWfGlCIG95kzPg_WXqzfVDP");
  window.sb = _sb2;
}
var sb = window.sb;
</script>
<script>
let ALL_USERS = [];
let ALL_SONGS_ADMIN = [];

function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showVal(v){ return (v===null||v===undefined||v==='') ? '<span class="badge null">NULL - missing</span>' : esc(v); }

async function initAdmin(){
  const status = document.getElementById('statusMsg');
  try{
    const { data: { user } } = await window.sb.auth.getUser();
    if(!user){ status.innerHTML = 'Not logged in. <a href="auth.html" style="color:#d4ff3f">Login</a>'; return; }
    const { data: prof } = await window.sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if(!prof || !prof.is_admin){
      status.innerHTML = '❌ Not admin. Your email: ' + (user.email||'') + '<br><br><span class="small">Ask main admin to set is_admin=true for you in Supabase > profiles.</span>';
      return;
    }
    document.getElementById('adminContent').style.display = 'block';
    status.style.display = 'none';
    await loadAdmin();
  }catch(e){
    status.innerHTML = 'Admin failed: ' + e.message + '<br><br><button class="ghost" onclick="initAdmin()">Retry</button>';
  }
}

async function loadAdmin(){
  await Promise.all([loadUsers(), loadPending()]);
}

async function loadUsers(){
  const el = document.getElementById('usersList');
  try{
    const { data, error } = await window.sb.from('profiles').select('*').order('created_at',{ascending:false}).limit(100);
    if(error) throw error;
    ALL_USERS = data || [];
    renderUsers(ALL_USERS);
  }catch(e){ el.innerHTML = '<p class="small">Users failed: '+esc(e.message)+'</p>'; }
}

function renderUsers(rows){
  const el = document.getElementById('usersList');
  if(!rows.length){ el.innerHTML = '<p class="small">No users found.</p>'; return; }
  el.innerHTML = rows.map(u=>{
    const name = u.full_name || u.name || '';
    const phone = u.phone || '';
    const email = u.email || '';
    const gender = u.gender || '';
    const country = u.country || '';
    const bal = (u.grind_balance ?? u.balance_grind ?? u.balance ?? 0);
    const isBlocked = u.blocked === true;
    return `<div class="card userCard" id="user-${u.id}">
      <b>${esc(name||'No Name')}</b> ${u.is_admin?'<span class="badge admin">ADMIN</span>':''} ${isBlocked?'<span class="badge blocked">BLOCKED</span>':''}<br>
      <span class="small">📞 Phone: ${showVal(phone)}</span><br>
      <span class="small">📧 Email: ${showVal(email)}</span><br>
      <span class="small">👤 Gender: ${showVal(gender)} • 🌍 Country: ${showVal(country)} • 💰 Balance: ${bal} G</span><br>
      <span class="small">🔒 Security Q: ${showVal(u.security_question||u.security_q)} • Answer: ${showVal(u.security_answer||u.security_a)}</span><br>
      <span class="small">🆔 ${u.id}</span><br><br>
      <button onclick="editUser('${u.id}')">✏️ Edit / Fill Missing</button>
      <button class="blue" onclick="sendReset('${u.id}')">🔑 Send Reset Link</button>
      <button class="${isBlocked?'ghost':'danger'}" onclick="toggleBlock('${u.id}', ${isBlocked})">${isBlocked?'✅ Unblock':'🚫 Block'}</button>
      <div id="edit-${u.id}" style="display:none;margin-top:10px;border-top:1px solid #333;padding-top:10px">
        <input id="e-name-${u.id}" placeholder="Full Name" value="${esc(name)}">
        <input id="e-phone-${u.id}" placeholder="Phone e.g. 59812345" value="${esc(phone)}">
        <input id="e-email-${u.id}" placeholder="Email" value="${esc(email)}">
        <select id="e-gender-${u.id}"><option value="">Select Gender</option><option value="Male" ${gender==='Male'?'selected':''}>Male</option><option value="Female" ${gender==='Female'?'selected':''}>Female</option><option value="Other" ${gender==='Other'?'selected':''}>Other</option></select>
        <select id="e-country-${u.id}"><option value="LS" ${country==='LS'?'selected':''}>Lesotho (LS)</option><option value="ZA" ${country==='ZA'?'selected':''}>South Africa (ZA)</option><option value="Other" ${country==='Other'?'selected':''}>Other</option></select>
        <input id="e-q-${u.id}" placeholder="Security Question" value="${esc(u.security_question||u.security_q||'')}">
        <input id="e-a-${u.id}" placeholder="Security Answer" value="${esc(u.security_answer||u.security_a||'')}">
        <button onclick="saveUser('${u.id}')">💾 Save</button>
        <button class="ghost" onclick="document.getElementById('edit-${u.id}').style.display='none'">Cancel</button>
      </div>
    </div>`;
  }).join('');
}

function filterUsers(){
  const q = document.getElementById('userSearch').value.toLowerCase().trim();
  if(!q) return renderUsers(ALL_USERS);
  renderUsers(ALL_USERS.filter(u=>
    (u.full_name||u.name||'').toLowerCase().includes(q) ||
    (u.phone||'').toLowerCase().includes(q) ||
    (u.email||'').toLowerCase().includes(q)
  ));
}

function editUser(id){
  const box = document.getElementById('edit-'+id);
  box.style.display = box.style.display==='none' ? 'block' : 'none';
}

async function saveUser(id){
  const full_name = document.getElementById('e-name-'+id).value.trim();
  const phone = document.getElementById('e-phone-'+id).value.trim();
  const email = document.getElementById('e-email-'+id).value.trim().toLowerCase();
  const gender = document.getElementById('e-gender-'+id).value;
  const country = document.getElementById('e-country-'+id).value;
  const secQ = document.getElementById('e-q-'+id).value.trim();
  const secA = document.getElementById('e-a-'+id).value.trim();
  if(!full_name){ alert('Enter full name'); return; }
  const updates = { full_name, name: full_name, phone, email, gender, country, security_question: secQ, security_q: secQ, security_answer: secA, security_a: secA };
  const { error } = await window.sb.from('profiles').update(updates).eq('id', id);
  if(error){ alert('Save failed: '+error.message); return; }
  alert('✅ Saved! No more NULL for this user.');
  await loadUsers();
  // keep search if any
  filterUsers();
}

async function sendReset(id){
  const u = ALL_USERS.find(x=> String(x.id)===String(id));
  const email = u?.email;
  if(!email){ alert('This user has no email saved. Fill email first with Edit, then Send Reset.'); return; }
  if(!confirm('Send password reset email to '+email+' ?')) return;
  const { error } = await window.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/auth.html' });
  if(error) alert('Reset failed: '+error.message);
  else alert('✅ Reset email sent to '+email+'\nTell them to check Inbox + Spam.');
}

async function toggleBlock(id, currentlyBlocked){
  const { error } = await window.sb.from('profiles').update({ blocked: !currentlyBlocked }).eq('id', id);
  if(error){ alert('Failed: '+error.message); return; }
  await loadUsers();
}

// ---- Pending sections (kept from your app, generic safe loaders) ----
async function loadPending(){
  // Deposits
  try{
    const { data } = await window.sb.from('deposits').select('*').eq('status','pending').order('created_at',{ascending:false}).limit(20);
    document.getElementById('pendingDeposits').innerHTML = (data&&data.length) ? data.map(d=>`<div class="card">💰 ${esc(d.amount||d.amount_grind||'')} G • ${esc(d.user_email||d.email||d.user_id||'')} • ${esc(d.created_at||'')} <br><button onclick="approveDeposit('${d.id}')">Approve</button><button class="ghost" onclick="rejectDeposit('${d.id}')">Reject</button></div>`).join('') : '<p class="small">No pending deposits</p>';
  }catch(e){ document.getElementById('pendingDeposits').innerHTML = '<p class="small">Deposits table: '+esc(e.message)+'</p>'; }
  try{
    const { data } = await window.sb.from('withdrawals').select('*').eq('status','pending').order('created_at',{ascending:false}).limit(20);
    document.getElementById('pendingWithdrawals').innerHTML = (data&&data.length) ? data.map(w=>`<div class="card">🏧 ${esc(w.amount||'')} G • ${esc(w.user_id||'')} <br><button onclick="approveWithdrawal('${w.id}')">Approve</button><button class="ghost" onclick="rejectWithdrawal('${w.id}')">Reject</button></div>`).join('') : '<p class="small">No pending withdrawals</p>';
  }catch(e){ document.getElementById('pendingWithdrawals').innerHTML = '<p class="small">Withdrawals: '+esc(e.message)+'</p>'; }
  try{
    const { data } = await window.sb.from('purchases').select('*').eq('status','pending').order('created_at',{ascending:false}).limit(20);
    document.getElementById('pendingPurchases').innerHTML = (data&&data.length) ? data.map(p=>`<div class="card">🎵 Song: ${esc(p.song_id||'')} • Fan: ${esc(p.fan_id||'')} • ${esc(p.amount||p.price_grind||'')} G <br><button onclick="approvePurchase('${p.id}')">Approve</button></div>`).join('') : '<p class="small">No pending purchases</p>';
  }catch(e){ document.getElementById('pendingPurchases').innerHTML = '<p class="small">Purchases: '+esc(e.message)+'</p>'; }
  try{
    const { data } = await window.sb.from('songs').select('*').order('created_at',{ascending:false}).limit(20);
    document.getElementById('pendingSongs').innerHTML = (data&&data.length) ? data.map(s=>`<div class="card">🎵 ${esc(s.title||'')} - ${esc(s.artist_name||'')} • ${esc(s.price_grind||'')} G • ${esc(s.status||'')}</div>`).join('') : '<p class="small">No songs</p>';
  }catch(e){ document.getElementById('pendingSongs').innerHTML = '<p class="small">Songs: '+esc(e.message)+'</p>'; }
}
async function approveDeposit(id){ const { error } = await window.sb.from('deposits').update({status:'approved'}).eq('id',id); if(error) alert(error.message); else loadPending(); }
async function rejectDeposit(id){ const { error } = await window.sb.from('deposits').update({status:'rejected'}).eq('id',id); if(error) alert(error.message); else loadPending(); }
async function approveWithdrawal(id){ const { error } = await window.sb.from('withdrawals').update({status:'approved'}).eq('id',id); if(error) alert(error.message); else loadPending(); }
async function rejectWithdrawal(id){ const { error } = await window.sb.from('withdrawals').update({status:'rejected'}).eq('id',id); if(error) alert(error.message); else loadPending(); }
async function approvePurchase(id){ const { error } = await window.sb.from('purchases').update({status:'approved'}).eq('id',id); if(error) alert(error.message); else loadPending(); }

initAdmin();
</script>
</body>
</html>
