<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Marotholi Les-Pot</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</head>
<body>
<div class="topbar"><div class="logo">MAROTHOLI <span>ADMIN</span></div><a class="badge" href="index.html">Home</a></div>
<div class="wrap">
  <div class="card center"><h2>🔐 Admin Panel</h2><p class="small" style="margin-top:6px">Approve deposits → Grinds added automatically. Do NOT approve without checking EcoCash 128235 / Postbank 1040278800016</p></div>
  <div class="card"><h3>💰 Pending Deposits</h3><div id="deposits" style="margin-top:10px">Loading...</div></div>
  <div class="card"><h3>🎵 All Songs</h3><div id="songs" style="margin-top:10px">Loading...</div></div>
</div>
<script>
const U="https://mmkxiniybctmgoozaecp.supabase.co"; const K="sb_publishable_wWhjXCZ4JWfGlCIG95kzPg_WXqzfVDP";
if(!window.sb && window.supabase) window.sb=window.supabase.createClient(U,K);
async function loadAdmin(){
  const {data:deps}=await sb.from('deposits').select('*').order('created_at',{ascending:false}).limit(50);
  document.getElementById('deposits').innerHTML=!deps||!deps.length?'No deposits':deps.map(d=>`<div style="border-bottom:1px solid #222;padding:12px 0;font-size:13px"><b>${d.user_email||d.user_id}</b><br>M${d.amount_maloti} → ${d.grinds} Grinds • ${d.method} • Ref: ${d.reference}<br>Status: <b>${d.status}</b><br>${d.status==='pending'?`<button style="margin-top:8px" onclick="approve('${d.id}','${d.user_id}',${d.grinds})">✅ Approve + Add Grinds</button> <button class="ghost" style="margin-top:8px" onclick="reject('${d.id}')">❌ Reject</button>`:''}</div>`).join('');
  const {data:songs}=await sb.from('songs').select('*').order('created_at',{ascending:false}).limit(50);
  document.getElementById('songs').innerHTML=!songs||!songs.length?'No songs':songs.map(s=>`<div style="border-bottom:1px solid #222;padding:10px 0;font-size:13px"><b>${s.title}</b> - ${s.artist} - ${s.price_grinds}G <button class="ghost" style="margin-top:6px" onclick="delSong('${s.id}')">Delete</button></div>`).join('');
}
async function approve(id,userId,grinds){
  if(!confirm('Approve '+grinds+' Grinds? Did you CHECK EcoCash/Postbank?')) return;
  const {data:prof}=await sb.from('profiles').select('grind_balance').eq('id',userId).single();
  const cur=prof?prof.grind_balance||0:0;
  await sb.from('profiles').update({grind_balance:cur+grinds}).eq('id',userId);
  await sb.from('deposits').update({status:'approved'}).eq('id',id);
  alert('Approved! +'+grinds+' Grinds'); loadAdmin();
}
async function reject(id){ if(!confirm('Reject this deposit?'))return; await sb.from('deposits').update({status:'rejected'}).eq('id',id); loadAdmin(); }
async function delSong(id){ if(!confirm('Delete song?'))return; await sb.from('songs').delete().eq('id',id); loadAdmin(); }
document.addEventListener('DOMContentLoaded',loadAdmin);
</script>
</body>
</html>
