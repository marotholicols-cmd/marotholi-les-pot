<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Marotholi Les-Pot</title>
<link rel="icon" href="icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
body{background:#0f0f0f;color:#fff;font-family:system-ui,-apple-system,sans-serif;margin:0;padding-bottom:110px}
header{background:#d4ff3f;color:#000;padding:14px;text-align:center;font-weight:900;font-size:18px}
header small{display:block;font-size:12px;font-weight:700;opacity:.7}
.wrap{max-width:700px;margin:0 auto;padding:14px}
.card{background:#1e1e1e;border:1px solid #333;border-radius:18px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 8px 0}
.small{font-size:13px;opacity:.7;line-height:1.5}
.btn{width:100%;background:#d4ff3f;color:#000;border:0;padding:12px;border-radius:99px;font-weight:900;font-size:14px;cursor:pointer;margin-top:10px}
.btn2{background:#222;color:#fff;border:1px solid #444;padding:8px 14px;border-radius:99px;font-weight:800;font-size:12px;cursor:pointer}
.btnApprove{background:#d4ff3f;color:#000;border:0;padding:9px 14px;border-radius:99px;font-weight:900;font-size:12px;cursor:pointer}
.btnReject{background:#ff4444;color:#fff;border:0;padding:9px 14px;border-radius:99px;font-weight:900;font-size:12px;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:11px;border-radius:99px;border:1px solid #444;background:#222;color:#fff;font-weight:800;cursor:pointer}
.tabs button.active{background:#d4ff3f;color:#000;border-color:#d4ff3f}
.item{border-bottom:1px solid #333;padding:10px 0}
.item:last-child{border-bottom:0}
.row{display:flex;gap:6px;margin-top:8px}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex;justify-content:space-around;padding:10px 0}
.bottomnav a{color:#fff;text-decoration:none;font-size:11px;font-weight:700;text-align:center;opacity:.65;line-height:1.3}
.bottomnav a.active{color:#d4ff3f;opacity:1}
</style>
</head>
<body>
<header>MAROTHOLI LES-POT<small>🛡️ Admin — Approve Only</small></header>
<div class="wrap">
<div class="card" id="deniedCard" style="display:none"><h3>⛔ Not Admin</h3><p class="small">This page is for Admin only. If you are the owner, make sure your profile role is 'admin' in Supabase.</p><button class="btn" onclick="location.href='index.html'">Go Home →</button></div>
<div id="adminContent" style="display:none">
<div class="card"><h3>📊 Quick Stats</h3><p class="small" id="stats">Loading...</p></div>
<div class="tabs"><button id="tabDep" class="active" onclick="switchTab('deposits')">💰 Deposits</button><button id="tabWith" onclick="switchTab('withdrawals')">💸 Withdrawals</button><button id="tabSongs" onclick="switchTab('songs')">🎵 Songs</button></div>
<div class="card"><h3 id="listTitle">Pending Deposits</h3><div id="list"><p class="small">Loading...</p></div></div>
</div>
</div>
<div class="bottomnav"><a href="index.html">🏠<br>Home</a><a href="discover.html">🎵<br>Discover</a><a href="library.html">📚<br>Library</a><a href="upload.html">⬆️<br>Upload</a><a href="wallet.html">💰<br>Wallet</a><a href="account.html">👤<br>Account</a></div>
<script>
let currentTab='deposits';
function switchTab(t){
  currentTab=t;
  document.getElementById('tabDep').className=t==='deposits'?'active':'';
  document.getElementById('tabWith').className=t==='withdrawals'?'active':'';
  document.getElementById('tabSongs').className=t==='songs'?'active':'';
  document.getElementById('listTitle').textContent=t==='deposits'?'Pending Deposits':t==='withdrawals'?'Pending Withdrawals':'All Songs';
  loadList();
}
async function checkAdmin(){
  const user=await getCurrentUser();
  if(!user){document.getElementById('deniedCard').style.display='block';return false;}
  const {data:prof}=await window.sb.from('profiles').select('*').eq('id',user.id).single();
  // Admin check: role = admin OR is_admin = true - NO email in code
  const isAdmin = prof && (prof.role==='admin' || prof.is_admin===true);
  if(!isAdmin){document.getElementById('deniedCard').style.display='block';return false;}
  document.getElementById('adminContent').style.display='block';
  return true;
}
async function loadStats(){
  const {data:deps}=await window.sb.from('deposits').select('*').eq('status','pending');
  const {data:wds}=await window.sb.from('withdrawals').select('*').eq('status','pending');
  const {data:songs}=await window.sb.from('songs').select('id');
  document.getElementById('stats').innerHTML="Pending Deposits: <b style='color:#d4ff3f'>"+(deps||[]).length+"</b> • Pending Withdrawals: <b style='color:#d4ff3f'>"+(wds||[]).length+"</b> • Total Songs: <b>"+(songs||[]).length+"</b>";
}
async function loadList(){
  const list=document.getElementById('list');
  list.innerHTML="<p class='small'>Loading...</p>";
  try{
    if(currentTab==='deposits'){
      const {data,error}=await window.sb.from('deposits').select('*, profiles(username)').order('created_at',{ascending:false}).limit(50);
      if(error) throw error;
      if(!data||!data.length){list.innerHTML="<p class='small'>No deposits.</p>";return;}
      list.innerHTML=data.map(function(d){
        const col=d.status==='approved'?'#d4ff3f':d.status==='rejected'?'#ff6b6b':'#ffb020';
        return "<div class='item'><b>"+Number(d.amount_grind||0).toFixed(2)+" G = M"+grindToMaloti(d.amount_grind||0)+"</b> • "+escHtml(d.method||'')+" • <span style='color:"+col+"'>"+escHtml(d.status||'pending')+"</span><br><span class='small'>User: "+escHtml(d.profiles?.username||d.user_id||'')+" • Ref: "+escHtml(d.reference||'')+" • Sender: "+escHtml(d.sender_info||'')+" • "+new Date(d.created_at).toLocaleString()+"</span>"+(d.status==='pending'?"<div class='row'><button class='btnApprove' onclick=\"approveDeposit('"+d.id+"','"+d.user_id+"',"+Number(d.amount_grind||0)+")\">✅ Approve + Add Grinds</button><button class='btnReject' onclick=\"rejectDeposit('"+d.id+"')\">❌ Reject</button></div>":"")+"</div>";
      }).join('');
    } else if(currentTab==='withdrawals'){
      const {data,error}=await window.sb.from('withdrawals').select('*, profiles(username)').order('created_at',{ascending:false}).limit(50);
      if(error) throw error;
      if(!data||!data.length){list.innerHTML="<p class='small'>No withdrawals.</p>";return;}
      list.innerHTML=data.map(function(w){
        const col=w.status==='approved'?'#d4ff3f':w.status==='rejected'?'#ff6b6b':'#ffb020';
        return "<div class='item'><b>"+Number(w.amount_grind||0).toFixed(2)+" G = M"+grindToMaloti(w.amount_grind||0)+"</b> • "+escHtml(w.method||'')+" • <span style='color:"+col+"'>"+escHtml(w.status||'pending')+"</span><br><span class='small'>User: "+escHtml(w.profiles?.username||w.user_id||'')+" • Account: "+escHtml(w.account||w.account_number||'')+" • Name: "+escHtml(w.full_name||'')+" • "+new Date(w.created_at).toLocaleString()+"</span>"+(w.status==='pending'?"<div class='row'><button class='btnApprove' onclick=\"approveWithdraw('"+w.id+"','"+w.user_id+"',"+Number(w.amount_grind||0)+")\">✅ Approve + Deduct</button><button class='btnReject' onclick=\"rejectWithdraw('"+w.id+"')\">❌ Reject</button></div>":"")+"</div>";
      }).join('');
    } else {
      const {data,error}=await window.sb.from('songs').select('*').order('created_at',{ascending:false}).limit(50);
      if(error) throw error;
      if(!data||!data.length){list.innerHTML="<p class='small'>No songs.</p>";return;}
      list.innerHTML=data.map(function(s){
        return "<div class='item'><b>"+escHtml(s.title)+"</b> • "+escHtml(s.artist_name)+" • "+formatPrice(s.price_grind)+" • "+escHtml(s.status||'')+"<br><span class='small'>Preview starts "+Math.floor(Number(s.preview_start||0)/60)+":"+String(Math.floor(Number(s.preview_start||0)%60)).padStart(2,'0')+"</span><div class='row'><button class='btn2' onclick=\"deleteSong('"+s.id+"')\">🗑️ Delete Song</button></div></div>";
      }).join('');
    }
  }catch(e){list.innerHTML="<p class='small'>❌ "+escHtml(e.message)+"</p>";}
}
async function approveDeposit(id,userId,amountG){
  if(!confirm('Approve this deposit? This will ADD '+Number(amountG).toFixed(2)+' G to user balance.')) return;
  const {data:prof}=await window.sb.from('profiles').select('balance_grind').eq('id',userId).single();
  const newBal=Number(prof?.balance_grind||0)+Number(amountG);
  await window.sb.from('profiles').update({balance_grind:newBal}).eq('id',userId);
  await window.sb.from('deposits').update({status:'approved'}).eq('id',id);
  alert('✅ Approved! Grinds added.'); loadStats(); loadList();
}
async function rejectDeposit(id){
  if(!confirm('Reject this deposit?')) return;
  await window.sb.from('deposits').update({status:'rejected'}).eq('id',id);
  alert('Rejected.'); loadStats(); loadList();
}
async function approveWithdraw(id,userId,amountG){
  if(!confirm('Approve withdrawal? This will DEDUCT '+Number(amountG).toFixed(2)+' G from user balance. Pay them now via '+amountG+' G = M'+grindToMaloti(amountG))) return;
  const {data:prof}=await window.sb.from('profiles').select('balance_grind').eq('id',userId).single();
  const newBal=Number(prof?.balance_grind||0)-Number(amountG);
  if(newBal<0){alert('User does not have enough balance!');return;}
  await window.sb.from('profiles').update({balance_grind:newBal}).eq('id',userId);
  await window.sb.from('withdrawals').update({status:'approved'}).eq('id',id);
  alert('✅ Approved! Remember to send money to user now.'); loadStats(); loadList();
}
async function rejectWithdraw(id){
  if(!confirm('Reject this withdrawal?')) return;
  await window.sb.from('withdrawals').update({status:'rejected'}).eq('id',id);
  alert('Rejected.'); loadStats(); loadList();
}
async function deleteSong(id){
  if(!confirm('Delete this song forever?')) return;
  await window.sb.from('songs').delete().eq('id',id);
  alert('Deleted.'); loadList();
}
document.addEventListener('DOMContentLoaded',async function(){
  const ok=await checkAdmin();
  if(ok){await loadStats();await loadList();}
});
</script>
</body>
</html>
