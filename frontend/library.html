<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library - Marotholi Les-Pot</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
  *{box-sizing:border-box} body{background:#0f0f0f;color:#fff;font-family:system-ui,sans-serif;margin:0;padding-bottom:140px}
  header{background:#d4ff3f;color:#000;padding:14px;text-align:center;font-weight:900}
  .wrap{max-width:600px;margin:0 auto;padding:16px}
  .card{background:#1e1e1e;border:1px solid #333;padding:14px;border-radius:14px;margin-bottom:12px;display:flex;gap:12px;align-items:center}
  .info{flex:1} .info b{font-size:16px} .info div{font-size:13px;opacity:.7}
  .playBtn{background:#d4ff3f;color:#000;border:0;padding:10px 18px;border-radius:20px;font-weight:900;cursor:pointer;white-space:nowrap}
  #msg{font-size:13px;opacity:.8;text-align:center;margin:10px;white-space:pre-wrap}
  #player{position:fixed;bottom:48px;left:0;right:0;background:#111;border-top:1px solid #333;padding:10px;text-align:center}
  #player audio{width:100%;max-width:600px}
  #nowPlaying{font-size:13px;margin-bottom:6px}
  .nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex;justify-content:space-around;padding:12px}
  .nav a{color:#fff;text-decoration:none;font-size:13px;opacity:.7} .nav a.active{opacity:1;color:#d4ff3f}
  .top{ display:flex; justify-content:space-between; align-items:center; }
  .badge{background:#d4ff3f;color:#000;padding:4px 10px;border-radius:10px;font-weight:900;font-size:12px}
  .cover{width:56px;height:56px;object-fit:cover;border-radius:10px;background:#333;flex-shrink:0}
</style>
</head>
<body>
<header>MAROTHOLI LES-POT — LIBRARY</header>
<div class="wrap">
  <div class="top"><h2 style="margin:4px 0 2px">My Bought Songs</h2><span class="badge" id="bal">G 0.00</span></div>
  <p style="opacity:.6;font-size:13px;margin:0 0 14px">Stream in app only. Song never leaves app.</p>
  <div id="list"></div>
  <div id="msg">Loading...</div>
  <p style="text-align:center"><a href="discover.html" style="color:#d4ff3f">🔥 Buy more in Discover →</a></p>
</div>

<div id="player" style="display:none">
  <div id="nowPlaying"></div>
  <audio id="audio" controls controlsList="nodownload"></audio>
</div>

<div class="nav"><a href="discover.html">🔥 Discover</a><a href="library.html" class="active">📚 Library</a><a href="upload.html">⬆️ Upload</a><a href="wallet.html">💰 Wallet</a><a href="admin.html">🛠️ Admin</a><a href="account.html">👤 Account</a></div>

<script>
async function load(){
  const msg = document.getElementById('msg');
  const list = document.getElementById('list');

  const { data: { user } } = await sb.auth.getUser();
  if(!user){ msg.innerHTML = 'Not logged in. <a href="auth.html" style="color:#d4ff3f">Go to Login →</a>'; return; }

  // FIXED: ONLY fan_id exists. Deleted buyer_id queries - they errored every time.
  const { data: purchases, error } = await sb.from('purchases').select('*, songs(*)').eq('status', 'approved').eq('fan_id', user.id).order('created_at', { ascending: false });

  if(error){ msg.textContent = "Error: " + error.message; return; }

  if(!purchases || purchases.length === 0){
    msg.innerHTML = "No approved songs yet.<br><a href='discover.html' style='color:#d4ff3f'>🔥 Buy one in Discover →</a>";
    return;
  }

  msg.textContent = `You own ${purchases.length} song(s) ✅`;
  list.innerHTML = "";

  purchases.forEach(p => {
    const s = p.songs;
    if(!s) return;
    const div = document.createElement('div');
    div.className = 'card';
    const cover = s.cover_url ? `<img src="${s.cover_url}" class="cover">` : `<div class="cover"></div>`;
    div.innerHTML = `${cover}<div class="info"><b>${s.title}</b><div>${s.artist_name} • ${s.price_grind}G • APPROVED</div></div><button class="playBtn">▶ PLAY</button>`;
    div.querySelector('.playBtn').onclick = () => playSong(s);
    list.appendChild(div);
  });
}

async function playSong(song){
  const msg = document.getElementById('msg');
  const player = document.getElementById('player');
  const audio = document.getElementById('audio');
  const now = document.getElementById('nowPlaying');

  msg.textContent = "Getting play link for " + song.title + "...";
  now.textContent = "🎵 " + song.title + " — " + song.artist_name;
  player.style.display = 'block';

  // FIXED: Only signed URL, no public URL fallback. Signed = expires, can't be shared/downloaded easily.
  const path = song.audio_path || '';
  if(!path){ msg.textContent = "No audio file found for this song. Contact admin."; return; }
  if(path.startsWith('http')){ msg.textContent = "Old song with public link - re-upload needed."; return; }

  const { data: signed, error } = await sb.storage.from('songs').createSignedUrl(path, 3600);
  if(error || !signed?.signedUrl){ msg.textContent = "Could not load song. Re-login."; return; }

  audio.src = signed.signedUrl;
  try{
    await audio.play();
    msg.textContent = "✅ Playing: " + song.title;
  }catch(e){
    msg.textContent = "Tap Play in player below.";
  }
}

load();
loadBalanceBadge();
</script>
</body>
</html>
