<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library - Marotholi Les-Pot</title>
<link rel="icon" href="icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="player.js"></script>
<link rel="stylesheet" href="style.css">
<style>
body{background:#0f0f0f;color:#fff;font-family:system-ui,-apple-system,sans-serif;margin:0;padding-bottom:180px}
header{background:#d4ff3f;color:#000;padding:14px;text-align:center;font-weight:900;font-size:18px;position:sticky;top:0;z-index:10}
header small{display:block;font-size:12px;font-weight:700;opacity:.7}
.wrap{max-width:600px;margin:0 auto;padding:14px}
.card{background:#1e1e1e;border:1px solid #333;border-radius:18px;padding:14px;margin-bottom:12px}
.small{font-size:13px;opacity:.7;line-height:1.5}
.btn{width:100%;background:#d4ff3f;color:#000;border:0;padding:13px;border-radius:99px;font-weight:900;font-size:15px;cursor:pointer}
.song{background:#1e1e1e;border:1px solid #333;border-radius:18px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.song img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#333;flex-shrink:0}
.song .meta{flex:1;min-width:0}
.song .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:6px;margin-top:9px}
.row button{flex:1;padding:10px;border-radius:99px;border:1px solid #444;background:#222;color:#fff;font-weight:800;font-size:13px;cursor:pointer}
.row button.play{background:#d4ff3f;color:#000;border-color:#d4ff3f}
.player{position:fixed;left:10px;right:10px;bottom:72px;background:#1e1e1e;border:1px solid #d4ff3f;border-radius:18px;padding:10px;display:none;gap:10px;align-items:center;z-index:50}
.player.show{display:flex}
.player img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#333}
.player .meta{flex:1;min-width:0}
.player .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.player .meta span{font-size:12px;opacity:.7}
.player button{background:#d4ff3f;color:#000;border:0;width:42px;height:42px;border-radius:99px;font-weight:900;font-size:18px;cursor:pointer;flex-shrink:0}
.player button.stop{background:#333;color:#fff}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex;justify-content:space-around;padding:10px 0;z-index:40}
.bottomnav a{color:#fff;text-decoration:none;font-size:11px;font-weight:700;text-align:center;opacity:.65;line-height:1.3}
.bottomnav a.active{color:#d4ff3f;opacity:1}
</style>
</head>
<body>
<header>MAROTHOLI LES-POT<small>📚 My Library • Bought Songs = FULL</small></header>
<div class="wrap">
<div class="card"><h3 style="margin:0">My Bought Songs</h3><p class="small" style="margin:6px 0 0 0">Only songs you bought play FULL here. No download — stream only, works on lock screen.</p></div>
<div id="list"><p class="small">Loading library...</p></div>
</div>
<div class="player" id="playerBar"><img id="playerCover" src="icon.svg"><div class="meta"><b id="playerTitle">No song playing</b><span id="playerArtist">Marotholi Les-Pot</span></div><button id="playerBtn" onclick="togglePlayer()">▶</button><button class="stop" onclick="stopPlayer()">✕</button></div>
<audio id="mainAudio" preload="none"></audio>
<div class="bottomnav"><a href="index.html">🏠<br>Home</a><a href="discover.html">🎵<br>Discover</a><a href="library.html" class="active">📚<br>Library</a><a href="upload.html">⬆️<br>Upload</a><a href="wallet.html">💰<br>Wallet</a><a href="account.html">👤<br>Account</a></div>
<script>
let mySongs=[];
async function loadLibrary(){
  const list=document.getElementById('list');
  const user=await getCurrentUser();
  if(!user){list.innerHTML="<div class='card'>Login to see your bought songs.<br><button class='btn' style='margin-top:10px' onclick=\"location.href='auth.html'\">Login →</button></div>";return;}
  try{
    const {data:purchases,[STRIPPED] window.sb.from('purchases').select('*, songs(*)').eq('buyer_id',user.id).order('created_at',{ascending:false});
    if(error) throw error;
    let songs=(purchases||[]).map(function(p){return p.songs;}).filter(function(s){return !!s;});
    mySongs=songs;
    if(!songs.length){list.innerHTML="<div class='card'>No bought songs yet.<br><span class='small'>Go to Discover, preview 30s, buy, it appears here FULL.</span><br><button class='btn' style='margin-top:10px' onclick=\"location.href='discover.html'\">Go to Discover →</button></div>";return;}
    list.innerHTML=songs.map(function(s){
      const cover=getCoverUrl(s.cover_url||s.cover_path);
      return "<div class='song'><img src='"+cover+"' onerror=\"this.src='icon.svg'\"><div class='meta'><b>"+escHtml(s.title)+"</b><span class='small'>"+escHtml(s.artist_name)+" • Bought • FULL</span><div class='row'><button class='play' onclick=\"playFull('"+s.id+"')\">▶ Play FULL</button><button onclick=\"shareSongLink('"+s.id+"','"+escHtml(s.title)+"','"+escHtml(s.artist_name)+"')\">🔗 Share</button></div></div></div>";
    }).join('');
  }catch(e){list.innerHTML="<div class='card'>❌ "+escHtml(e.message)+"<br><button class='btn' style='margin-top:10px' onclick='loadLibrary()'>🔄 Try Again</button></div>";}
}
async function playFull(id){
  const s=mySongs.find(function(x){return String(x.id)===String(id);});
  if(!s){ alert('Song not found'); return; }
  let url = s.audio_url;
  if(!url || !String(url).startsWith('http')){
    alert('No audio_url for this song');
    return;
  }
  const audio = document.getElementById('mainAudio');
  const bar = document.getElementById('playerBar');
  const titleEl = document.getElementById('playerTitle');
  const artistEl = document.getElementById('playerArtist');
  const coverEl = document.getElementById('playerCover');
  const btn = document.getElementById('playerBtn');
  if(titleEl) titleEl.textContent = s.title || 'Unknown';
  if(artistEl) artistEl.textContent = s.artist_name || '';
  if(coverEl && s.cover_url) coverEl.src = s.cover_url;
  if(bar) bar.classList.add('show');
  if(window._previewTimer) clearInterval(window._previewTimer);
  // FIXED: Show real song + artist + cover on lock screen / notification
  if('mediaSession' in navigator){
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title: s.title || 'Unknown Song',
        artist: s.artist_name || 'Marotholi Les-Pot',
        album: 'Marotholi Les-Pot',
        artwork: s.cover_url ? [{src: s.cover_url, sizes: '512x512', type: 'image/jpeg'}] : []
      });
      navigator.mediaSession.setActionHandler('play', function(){ const a=document.getElementById('mainAudio'); a.play(); const b=document.getElementById('playerBtn'); if(b) b.textContent='⏸'; });
      navigator.mediaSession.setActionHandler('pause', function(){ const a=document.getElementById('mainAudio'); a.pause(); const b=document.getElementById('playerBtn'); if(b) b.textContent='▶'; });
      navigator.mediaSession.setActionHandler('stop', function(){ stopPlayer(); });
    }catch(e){}
  }
  audio.src = url;
  audio.currentTime = 0;
  try{
    await audio.play();
    if(btn) btn.textContent = '⏸';
  }catch(e){
    alert('Play failed: ' + e.message);
  }
}
function togglePlayer(){
  const audio = document.getElementById('mainAudio');
  const btn = document.getElementById('playerBtn');
  if(audio.paused){ audio.play(); if(btn) btn.textContent='⏸'; }
  else { audio.pause(); if(btn) btn.textContent='▶'; }
}
function stopPlayer(){
  const audio = document.getElementById('mainAudio');
  const bar = document.getElementById('playerBar');
  audio.pause(); audio.src='';
  if(bar) bar.classList.remove('show');
  if(window._previewTimer) clearInterval(window._previewTimer);
  if('mediaSession' in navigator){ try{ navigator.mediaSession.metadata = null; }catch(e){} }
}
document.addEventListener('DOMContentLoaded',loadLibrary);
</script>
</body>
</html>
