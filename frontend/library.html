<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library - Marotholi Les-Pot</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
    * {
    box-sizing: border-box;
  }

  body {
    background: #0f0f0f;
    color: #fff;
    font-family: system-ui, sans-serif;
    margin: 0;
    overflow-x: hidden;
    padding-bottom: 180px;
  }

  header {
    background: #d4ff3f;
    color: #000;
    padding: 14px;
    text-align: center;
    font-weight: 900;
    font-size: 18px;
    position: sticky;
    top: 0;
    z-index: 50;
    letter-spacing: .3px;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 14px;
    width: 100%;
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .top-row h1 {
    margin: 0;
    font-size: 28px;
    line-height: 1.1;
  }

  .top-row p {
    margin: 4px 0 0;
    font-size: 13px;
    opacity: .6;
  }

  .bal-pill {
    background: #d4ff3f;
    color: #000;
    padding: 7px 12px;
    border-radius: 99px;
    font-weight: 900;
    font-size: 13px;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 4px;
  }

  .small {
    font-size: 13px;
    opacity: .7;
    line-height: 1.5;
  }

  .center {
    text-align: center;
  }

  .search-box {
    margin: 14px 0 10px;
  }

  .search-box input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #fff;
    font-size: 14px;
    outline: none;
  }

  .search-box input:focus {
    border-color: #d4ff3f;
  }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .filters button {
    padding: 7px 13px;
    border-radius: 99px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .filters button.on {
    background: #d4ff3f;
    color: #000;
    border-color: #d4ff3f;
  }

  /* SONG CARD - SAME AS SCREENSHOT, BETTER */
  .song-card {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 12px;
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .song-card.playing {
    border-color: #d4ff3f;
    background: linear-gradient(135deg, #1e2a00 0%, #1e1e1e 70%);
  }

  .cover {
    width: 60px;
    height: 60px;
    min-width: 60px;
    border-radius: 12px;
    background: linear-gradient(135deg, #ff2ea6, #ffcc00, #d4ff3f);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    overflow: hidden;
  }

  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .meta {
    flex: 1;
    min-width: 0;
  }

  .meta b {
    font-size: 16px;
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .meta .sub {
    font-size: 13px;
    opacity: .65;
    line-height: 1.4;
    margin-top: 2px;
  }

  .meta .price-line {
    font-size: 12px;
    color: #d4ff3f;
    margin-top: 2px;
    font-weight: 700;
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-end;
  }

  .playBtn {
    background: #d4ff3f;
    color: #000;
    border: 0;
    padding: 11px 18px;
    border-radius: 99px;
    font-weight: 900;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
  }

  .shareBtn {
    background: #222;
    color: #fff;
    border: 1px solid #444;
    padding: 7px 12px;
    border-radius: 99px;
    font-weight: 700;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
  }

  .playing-label {
    text-align: center;
    font-size: 14px;
    margin: 10px 0 6px;
    font-weight: 700;
  }

  .buy-more {
    text-align: center;
    display: block;
    color: #d4ff3f;
    font-weight: 800;
    font-size: 16px;
    margin-top: 8px;
  }

  /* MINI PLAYER - LIKE SCREENSHOT */
  #miniPlayer {
    position: fixed;
    bottom: 62px;
    left: 0;
    right: 0;
    background: #111;
    border-top: 1px solid #333;
    padding: 10px 12px 8px;
    z-index: 40;
    display: none;
  }

  #miniPlayer .now {
    text-align: center;
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .mini-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .mini-row audio {
    flex: 1;
    height: 36px;
  }

  .mini-row audio::-webkit-media-controls-panel {
    background: #fff;
  }

  .iconBtn {
    background: #222;
    color: #fff;
    border: 1px solid #333;
    border-radius: 99px;
    width: 36px;
    height: 36px;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .iconBtn.lime {
    background: #d4ff3f;
    color: #000;
    border-color: #d4ff3f;
  }

  /* FULLSCREEN PLAYER */
  #fullPlayer {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #0f0f0f 0%, #1a2a00 60%, #0f0f0f 100%);
    z-index: 100;
    display: none;
    flex-direction: column;
    padding: 16px;
    overflow-y: auto;
  }

  #fullPlayer.open {
    display: flex;
  }

  .full-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .full-cover {
    width: 220px;
    height: 220px;
    margin: 24px auto 16px;
    border-radius: 24px;
    background: linear-gradient(135deg, #ff2ea6, #ffcc00, #d4ff3f);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(212, 255, 63, .25);
  }

  .full-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .full-title {
    text-align: center;
    font-size: 22px;
    font-weight: 900;
    margin: 0;
  }

  .full-artist {
    text-align: center;
    opacity: .7;
    margin: 4px 0 0;
    font-size: 14px;
  }

  .full-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 20px 0 10px;
  }

  .full-controls button {
    border: 0;
    border-radius: 99px;
    cursor: pointer;
    font-weight: 900;
  }

  .bigPlay {
    width: 72px;
    height: 72px;
    font-size: 28px;
    background: #d4ff3f;
    color: #000;
  }

  .skipBtn {
    width: 52px;
    height: 52px;
    font-size: 20px;
    background: #222;
    color: #fff;
  }

  .settings-box {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 14px;
    margin-top: 12px;
  }

  .settings-box h3 {
    margin: 0 0 10px;
    font-size: 15px;
  }

  .settings-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .settings-row button {
    flex: 1;
    padding: 10px;
    border-radius: 99px;
    border: 1px solid #333;
    background: #222;
    color: #fff;
    font-weight: 800;
    cursor: pointer;
    font-size: 13px;
  }

  .settings-row button.on {
    background: #d4ff3f;
    color: #000;
    border-color: #d4ff3f;
  }

  .settings-row label {
    font-size: 13px;
    opacity: .7;
    width: 100%;
  }

  .settings-row input[type="range"] {
    width: 100%;
  }

  .bottomnav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #111;
    border-top: 1px solid #333;
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
    z-index: 50;
  }

  .bottomnav a {
    color: #fff;
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    opacity: .7;
    padding: 6px;
  }

  .bottomnav a.active {
    color: #d4ff3f;
    opacity: 1;
  }
</style>
</head>
<body>

<header>MAROTHOLI LES-POT — LIBRARY</header>

<div class="wrap">
  <div class="top-row">
    <div>
      <h1>My Bought Songs</h1>
      <p>Stream in app only. Song never leaves app.</p>
    </div>
    <span class="bal-pill" id="topBal">0.00 G</span>
  </div>

  <div class="search-box">
    <input id="searchInput" placeholder="🔍 Search my songs..." oninput="applyFilter()">
  </div>

  <div class="filters">
    <button class="on" onclick="setFilter('All', this)">All</button>
    <button onclick="setFilter('Playing', this)">▶️ Now Playing</button>
    <button onclick="setFilter('Recent', this)">🕒 Recent</button>
  </div>

  <div id="list">
    <p class="small">Loading your songs...</p>
  </div>

  <div id="playingLabel" class="playing-label hidden">✅ Playing: —</div>

  <a class="buy-more" href="discover.html">🔥 Buy more in Discover →</a>
</div>

<!-- MINI PLAYER - SMALL VIEW -->
<div id="miniPlayer">
  <div class="now" id="miniNow">🎵 —</div>
  <div class="mini-row">
    <button class="iconBtn" onclick="prevSong()" title="Previous">⏮️</button>
    <audio id="audio" controls controlsList="nodownload" preload="none"></audio>
    <button class="iconBtn" onclick="nextSong()" title="Next">⏭️</button>
    <button class="iconBtn lime" onclick="openFull()" title="Full Screen">⛶</button>
    <button class="iconBtn" onclick="openSettingsFromMini()" title="Settings">⚙️</button>
  </div>
  <div class="center" style="margin-top:6px">
    <button class="shareBtn" onclick="shareCurrent()">🔗 Share This Song</button>
    <button class="shareBtn" onclick="toggleRepeat()">🔁 <span id="repeatLabel">Off</span></button>
    <button class="shareBtn" onclick="toggleShuffle()">🔀 <span id="shuffleLabel">Off</span></button>
  </div>
</div>

<!-- FULLSCREEN PLAYER -->
<div id="fullPlayer">
  <div class="full-top">
    <button class="iconBtn" onclick="closeFull()">▾ Small View</button>
    <b style="font-size:13px;opacity:.7">NOW PLAYING</b>
    <button class="iconBtn" onclick="shareCurrent()">🔗 Share</button>
  </div>

  <div class="full-cover" id="fullCover">🎵</div>
  <p class="full-title" id="fullTitle">—</p>
  <p class="full-artist" id="fullArtist">—</p>
  <p class="center small" id="fullPrice">—</p>

  <div class="full-controls">
    <button class="skipBtn" onclick="prevSong()">⏮️</button>
    <button class="bigPlay" id="fullPlayBtn" onclick="togglePlay()">⏸️</button>
    <button class="skipBtn" onclick="nextSong()">⏭️</button>
  </div>

  <div class="center">
    <button class="shareBtn" onclick="shareCurrent()">🔗 Share Link</button>
    <button class="shareBtn" onclick="toggleRepeat()">🔁 Repeat: <span id="repeatLabel2">Off</span></button>
    <button class="shareBtn" onclick="toggleShuffle()">🔀 Shuffle: <span id="shuffleLabel2">Off</span></button>
  </div>

  <!-- SETTINGS -->
  <div class="settings-box">
    <h3>⚙️ Player Settings</h3>

    <div class="settings-row">
      <label>Speed</label>
      <button onclick="setSpeed(0.75, this)">0.75x</button>
      <button class="on" onclick="setSpeed(1, this)">1x</button>
      <button onclick="setSpeed(1.25, this)">1.25x</button>
      <button onclick="setSpeed(1.5, this)">1.5x</button>
    </div>

    <div class="settings-row">
      <label>Repeat</label>
      <button id="repOffBtn" class="on" onclick="setRepeat('off')">Off</button>
      <button id="repOneBtn" onclick="setRepeat('one')">🔂 One</button>
      <button id="repAllBtn" onclick="setRepeat('all')">🔁 All</button>
    </div>

    <div class="settings-row">
      <label>Volume</label>
      <input type="range" min="0" max="100" value="100" oninput="setVolume(this.value)">
    </div>

    <div class="settings-row">
      <button onclick="closeFull()">▾ Back to Small View</button>
      <button onclick="location.href='discover.html'">🔥 Discover</button>
    </div>
  </div>
</div>

<div class="bottomnav">
  <a href="discover.html">🔥<br>Discover</a>
  <a href="library.html" class="active">📚<br>Library</a>
  <a href="upload.html">⬆️<br>Upload</a>
  <a href="wallet.html">💰<br>Wallet</a>
  <a href="admin.html">🛠️<br>Admin</a>
  <a href="account.html">👤<br>Account</a>
</div>

<script>
  // -------------------------------------------------
  // LIBRARY - SAME LAYOUT AS SCREENSHOT + BETTER
  // Features: Settings / Full Screen / Small View / Share Link
  // RULE: ARTIST SETS OWN PRICE - from purchases.price_grind
  // Stream only - no download
  // -------------------------------------------------

  let ALL = [];
  let FILTER = 'All';
  let CURRENT_INDEX = -1;
  let CURRENT = null;
  let REPEAT = 'off';
  let SHUFFLE = false;
  let SPEED = 1;

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function setFilter(f, btn) {
    FILTER = f;
    document.querySelectorAll('.filters button').forEach(function (b) {
      b.classList.remove('on');
    });
    if (btn) btn.classList.add('on');
    applyFilter();
  }

  function applyFilter() {
    const q = (document.getElementById('searchInput').value || '').toLowerCase();
    let list = ALL.filter(function (it) {
      const s = it.song || {};
      return !q || (s.title || '').toLowerCase().includes(q) || (s.artist_name || '').toLowerCase().includes(q);
    });
    if (FILTER === 'Playing' && CURRENT) {
      list = list.filter(function (it) { return it.song && it.song.id === CURRENT.id; });
    }
    if (FILTER === 'Recent') {
      list = [...list].sort(function (a, b) {
        return new Date(b.created_at) - new Date(a.created_at);
      });
    }
    render(list);
  }

  function render(list) {
    const el = document.getElementById('list');
    if (!list.length) {
      el.innerHTML = '<p class="small">No bought songs yet.<br><a href="discover.html" style="color:#d4ff3f;font-weight:800">🔥 Buy in Discover →</a></p>';
      return;
    }
    el.innerHTML = list.map(function (it) {
      const s = it.song || {};
      const price = Number(it.price_grind || s.price_grind || 0);
      const maloti = (price * 10).toFixed(2);
      const isPlaying = CURRENT && CURRENT.id === s.id;
      const cover = s.cover_url
        ? '<div class="cover"><img src="' + esc(s.cover_url) + '"></div>'
        : '<div class="cover">🎵</div>';
      const realIndex = ALL.findIndex(function (x) { return x.song && x.song.id === s.id; });
      return (
        '<div class="song-card ' + (isPlaying ? 'playing' : '') + '">' +
          cover +
          '<div class="meta">' +
            '<b>' + esc(s.title) + '</b>' +
            '<div class="sub">' + esc(s.artist_name) + ' • ' + price + ' G • APPROVED</div>' +
            '<div class="price-line">Artist price: ' + price + ' G = M' + maloti + '</div>' +
          '</div>' +
          '<div class="actions">' +
            '<button class="playBtn" onclick="playSong(' + realIndex + ')">' + (isPlaying ? '⏸️ PAUSE' : '▶ PLAY') + '</button>' +
            '<button class="shareBtn" onclick="shareSong(\'' + esc(s.title) + '\',\'' + esc(s.artist_name) + '\',\'' + s.id + '\')">🔗 Share</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  async function loadLibrary() {
    try {
      const { data: { user } } = await window.sb.auth.getUser();
      if (!user) { location.href = 'auth.html'; return; }
      const { data: buys, error } = await window.sb
        .from('purchases')
        .select('*, song:songs(*)')
        .eq('fan_id', user.id)
        .eq('status', 'approved')
        .order('created_at', { ascending: false });
      if (error) throw error;
      ALL = (buys || []).filter(function (b) { return b.song; });
      applyFilter();
    } catch (e) {
      document.getElementById('list').innerHTML = 'Error: ' + esc(e.message);
    }
  }

  async function loadBal() {
    try {
      const { user, profile } = await getMyProfile();
      const el = document.getElementById('topBal');
      if (el && profile) el.textContent = Number(profile.grind_balance || 0).toFixed(2) + ' G';
    } catch (e) {}
  }

  async function playSong(index) {
    if (index < 0 || index >= ALL.length) return;
    const it = ALL[index];
    const s = it.song;
    // If same song and playing, pause
    if (CURRENT && CURRENT.id === s.id) {
      togglePlay();
      applyFilter();
      return;
    }
    CURRENT_INDEX = index;
    CURRENT = s;

    document.getElementById('miniPlayer').style.display = 'block';
    document.getElementById('miniNow').textContent = '🎵 ' + s.title + ' — ' + s.artist_name;
    document.getElementById('playingLabel').classList.remove('hidden');
    document.getElementById('playingLabel').textContent = '✅ Playing: ' + s.title;
    document.getElementById('fullTitle').textContent = s.title;
    document.getElementById('fullArtist').textContent = s.artist_name;
    document.getElementById('fullPrice').textContent = 'Artist price: ' + Number(it.price_grind || s.price_grind || 0) + ' G • Owned ✅';
    document.getElementById('fullCover').innerHTML = s.cover_url ? '<img src="' + esc(s.cover_url) + '">' : '🎵';

    const a = document.getElementById('audio');
    a.playbackRate = SPEED;
    a.loop = (REPEAT === 'one');

    try {
      const { data } = await window.sb.storage.from('songs').createSignedUrl(s.audio_path, 3600);
      if (data && data.signedUrl) {
        a.src = data.signedUrl;
        await a.play();
        document.getElementById('fullPlayBtn').textContent = '⏸️';
      }
    } catch (e) {}
    applyFilter();
  }

  function togglePlay() {
    const a = document.getElementById('audio');
    if (!a.src) return;
    if (a.paused) {
      a.play();
      document.getElementById('fullPlayBtn').textContent = '⏸️';
    } else {
      a.pause();
      document.getElementById('fullPlayBtn').textContent = '▶️';
    }
  }

  function nextSong() {
    if (!ALL.length) return;
    let next = CURRENT_INDEX + 1;
    if (SHUFFLE) {
      next = Math.floor(Math.random() * ALL.length);
    }
    if (next >= ALL.length) {
      if (REPEAT === 'all') next = 0;
      else return;
    }
    playSong(next);
  }

  function prevSong() {
    if (!ALL.length) return;
    let prev = CURRENT_INDEX - 1;
    if (prev < 0) prev = ALL.length - 1;
    playSong(prev);
  }

  // ---------- SETTINGS ----------
  function setSpeed(v, btn) {
    SPEED = v;
    const a = document.getElementById('audio');
    a.playbackRate = v;
    document.querySelectorAll('.settings-row button').forEach(function (b) {
      if (b.textContent.includes('x')) b.classList.remove('on');
    });
    if (btn) btn.classList.add('on');
  }

  function setRepeat(mode) {
    REPEAT = mode;
    const a = document.getElementById('audio');
    a.loop = (mode === 'one');
    document.getElementById('repeatLabel').textContent = mode === 'off' ? 'Off' : mode;
    document.getElementById('repeatLabel2').textContent = mode === 'off' ? 'Off' : mode;
    document.getElementById('repOffBtn').classList.toggle('on', mode === 'off');
    document.getElementById('repOneBtn').classList.toggle('on', mode === 'one');
    document.getElementById('repAllBtn').classList.toggle('on', mode === 'all');
  }

  function toggleRepeat() {
    const order = ['off', 'one', 'all'];
    const next = order[(order.indexOf(REPEAT) + 1) % 3];
    setRepeat(next);
  }

  function toggleShuffle() {
    SHUFFLE = !SHUFFLE;
    document.getElementById('shuffleLabel').textContent = SHUFFLE ? 'On' : 'Off';
    document.getElementById('shuffleLabel2').textContent = SHUFFLE ? 'On' : 'Off';
  }

  function setVolume(v) {
    const a = document.getElementById('audio');
    a.volume = Number(v) / 100;
  }

  function openSettingsFromMini() {
    openFull();
  }

  // ---------- FULL / SMALL VIEW ----------
  function openFull() {
    if (!CURRENT) {
      alert('Play a song first');
      return;
    }
    document.getElementById('fullPlayer').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeFull() {
    document.getElementById('fullPlayer').classList.remove('open');
    document.body.style.overflow = '';
  }

  // ---------- SHARE ----------
  function shareSong(title, artist, id) {
    const text = '🔥 Listen to ' + title + ' by ' + artist + ' on Marotholi Les-Pot';
    const url = location.origin + '/discover.html?song=' + (id || '');
    if (navigator.share) {
      navigator.share({ title: title, text: text, url: url }).catch(function () {});
    } else {
      navigator.clipboard.writeText(text + ' ' + url).then(function () {
        alert('🔗 Link copied! Share it');
      });
    }
  }

  function shareCurrent() {
    if (!CURRENT) {
      alert('Play a song first');
      return;
    }
    shareSong(CURRENT.title, CURRENT.artist_name, CURRENT.id);
  }

  document.addEventListener('DOMContentLoaded', function () {
    loadLibrary();
    loadBal();
    const a = document.getElementById('audio');
    a.addEventListener('ended', function () {
      if (REPEAT === 'one') return;
      nextSong();
    });
    a.addEventListener('play', function () {
      document.getElementById('fullPlayBtn').textContent = '⏸️';
    });
    a.addEventListener('pause', function () {
      document.getElementById('fullPlayBtn').textContent = '▶️';
    });
  });
</script>
</body>
</html>
