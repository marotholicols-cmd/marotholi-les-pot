<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library — Marotholi Les-Pot</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar"><div class="logo">MAROTHOLI <span>LES-POT</span></div><span class="badge">📚 LIBRARY</span></div>
<div class="wrap">
<div class="card"><h3>Your Bought Songs</h3><p>Full playback + download. You own these.</p><input id="libSearch" placeholder="🔍 Search your library..." oninput="filterLib()"></div>
<div id="libList"></div>
<div id="libEmpty" class="card center hidden"><h3>No songs yet</h3><p>Buy songs in Discover to see them here.</p><a href="discover.html"><button>Go to Discover →</button></a></div>
</div>
<div id="player"></div>
<nav class="bottomnav"><a href="discover.html">🏠<br>Discover</a><a href="library.html" class="active">📚<br>Library</a><a href="wallet.html">💰<br>Wallet</a><a href="upload.html">📤<br>Upload</a><a href="account.html">👤<br>Account</a></nav>
<script src="app.js"></script><script src="player.js"></script>
<script>
let LIB=[];
async function loadLib(){const el=document.getElementById('libList');el.innerHTML='<div class="card center">Loading...</div>';try{LIB=await window.LES_POT.getLibrary()||[];renderLib(LIB);}catch(e){el.innerHTML='<div class="card center">Login to see library. <a href="auth.html">Login</a></div>';}}
function renderLib(list){const el=document.getElementById('libList');document.getElementById('libEmpty').classList.toggle('hidden',list.length>0);if(!list.length){el.innerHTML='';return;}el.innerHTML=list.map(s=>`<div class="card"><div class="song">${s.cover_url?`<img src="${s.cover_url}">`:`<div class="coverPlaceholder">🎵</div>`}<div class="meta"><b>${escapeHtml(s.title||'')}</b><small>${escapeHtml(s.artist||'')} • Bought ${s.created_at?new Date(s.created_at).toLocaleDateString():''} • ${s.price_grinds||1}G</small><div><span class="pill">✅ Owned</span></div></div><button class="playBtn" onclick="playSong('${s.id}')">▶ Play</button></div><div class="flex" style="margin-top:12px"><button onclick="downloadSong('${s.audio_url}','${escapeHtml(s.title||'song')}')">⬇️ Download</button><button class="ghost" onclick="shareLib('${escapeHtml(s.title||'')}','${s.id}')">📤 WhatsApp</button></div><p class="small">🧾 Receipt: ${s.price_grinds||1} Grinds • M${((s.price_grinds||1)*10).toFixed(2)} • ${s.created_at?new Date(s.created_at).toLocaleString():''}</p></div>`).join('');}
function filterLib(){const q=(document.getElementById('libSearch').value||'').toLowerCase();renderLib(LIB.filter(s=>(s.title||'').toLowerCase().includes(q)||(s.artist||'').toLowerCase().includes(q)));}
function escapeHtml(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function downloadSong(url,title){if(!url){alert('No audio file.');return;}const a=document.createElement('a');a.href=url;a.download=title+'.mp3';a.target='_blank';a.click();}
function shareLib(title,id){window.open('https://wa.me/?text='+encodeURIComponent('🎵 I bought '+title+' on LES-POT 🇱🇸 '+location.origin+'/discover.html?song='+id));}
loadLib();
</script>
</body>
</html>
