<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Library - Marotholi Les-Pot</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8ff00">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=99"></script>
<script src="player.js?v=99"></script>
</head>
<body>
<div class="topbar"><div class="logo">MAROTHOLI <span>LES-POT</span></div><a class="badge" href="wallet.html" id="topBal">0 Grinds</a></div>
<div class="wrap">
  <div class="card"><h2>📚 My Library</h2><p class="small" style="margin-top:6px">Songs you BOUGHT (full) + Songs you UPLOADED.</p><div style="display:flex;gap:8px;margin-top:12px"><button id="tabBought" onclick="showTab('bought')" style="flex:1">✅ Bought</button><button id="tabUploads" onclick="showTab('uploads')" style="flex:1;background:#222;color:#fff">⬆️ My Uploads</button></div></div>
  <div class="card"><div id="libList">Loading library...</div></div>
  <div class="card"><h3>💳 Need Grinds?</h3><p class="small">EcoCash: 128235 — Marotholi Lespot MSU<br>Postbank Visa: 1040278800016 — Marotholi Lespot</p><br><button onclick="location.href='wallet.html'">Top Up Now</button></div>
</div>
<div class="miniPlayer hidden" id="miniPlayer"><img id="pCover" src="icon.svg"><div class="pInfo"><b id="pTitle">No song</b><small id="pArtist">Marotholi</small></div><button id="pPlayBtn" onclick="togglePlay()">▶</button><button class="closeBtn" onclick="stopSong(true)">✕</button></div>
<nav class="bottomnav"><a href="index.html">🏠<br>Home</a><a href="discover.html">🎵<br>Discover</a><a href="library.html" class="active">📚<br>Library</a><a href="wallet.html">👛<br>Wallet</a><a href="upload.html">⬆️<br>Upload</a><a href="auth.html">👤<br>Account</a></nav>
<script>
const U="https://mmkxiniybctmgoozaecp.supabase.co"; const K="sb_publishable_wWhjXCZ4JWfGlCIG95kzPg_WXqzfVDP";
if(!window.sb && window.supabase) window.sb=window.supabase.createClient(U,K);
let BOUGHT=[], UPLOADS=[], CURRENT_TAB='bought';
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function showTab(tab){
  CURRENT_TAB=tab;
  document.getElementById('tabBought').style.background=tab==='bought'?'#c8ff00':'#222';
  document.getElementById('tabBought').style.color=tab==='bought'?'#000':'#fff';
  document.getElementById('tabUploads').style.background=tab==='uploads'?'#c8ff00':'#222';
  document.getElementById('tabUploads').style.color=tab==='uploads'?'#000':'#fff';
  renderLib();
}
function renderLib(){
  const box=document.getElementById('libList');
  const list=CURRENT_TAB==='bought'?BOUGHT:UPLOADS;
  if(!list.length){
    box.innerHTML = CURRENT_TAB==='bought' ? 'No bought songs yet.<br><br>Go to <a href="discover.html">Discover</a> → Buy a song → It will appear here full, forever.' : 'No uploads yet.<br><br>Go to <a href="upload.html">Upload</a> → Pick MP3 → Set YOUR price.';
    return;
  }
  box.innerHTML=list.map(s=>{
    const title=esc(s.title||'Untitled'); const artist=esc(s.artist||s.artist_name||'Unknown'); const cover=esc(s.cover_url||'icon.svg'); const price=s.price_grinds||s.price_grind||1; const audio=esc(s.audio_url||s.audio_path||'');
    return `<div class="songCard"><img src="${cover}" onerror="this.src='icon.svg'"><div class="info"><b>${title}</b><small>${artist} • ${s.genre||'Music'} • ${CURRENT_TAB==='uploads' ? 'YOUR Price: '+price+'G = M'+(price*10) : '✅ Owned - Full Song'}</small></div><div class="actions"><button class="playBtn" onclick="playSong('${audio}','${title}','${artist}','${cover}',false)">▶ Play Full</button></div></div>`;
  }).join('');
}
async function loadLibrary(){
  const box=document.getElementById('libList');
  const {user, profile}=await getMyProfile();
  if(!user){ box.innerHTML='Log in to see your Library.<br><br><button onclick="location.href=\'auth.html\'">Log In</button>'; return; }
  if(profile) document.getElementById('topBal').textContent=(profile.grind_balance ?? profile.grinds ?? 0)+' Grinds';
  try{ const {data:ups}=await sb.from('songs').select('*').eq('artist_id', user.id).order('created_at',{ascending:false}); UPLOADS=ups||[]; if(!UPLOADS.length){ const {data:u2}=await sb.from('songs').select('*').eq('uploader_id', user.id).order('created_at',{ascending:false}); if(u2) UPLOADS=u2; } }catch(e){ UPLOADS=[]; }
  BOUGHT=[];
  try{
    const ids=await getMyPurchases(user.id);
    if(ids.length){ const {data:songs}=await sb.from('songs').select('*').in('id', ids); BOUGHT=songs||[]; }
  }catch(e){}
  renderLib();
}
document.addEventListener('DOMContentLoaded', loadLibrary);
</script>
</body>
</html>
