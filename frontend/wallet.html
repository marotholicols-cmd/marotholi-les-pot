<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wallet - Marotholi Les-Pot</title>
<link rel="icon" href="icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
body{background:#0f0f0f;color:#fff;font-family:system-ui,-apple-system,sans-serif;margin:0;padding-bottom:110px}
header{background:#d4ff3f;color:#000;padding:14px;text-align:center;font-weight:900;font-size:18px}
header small{display:block;font-size:12px;font-weight:700;opacity:.7}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.card{background:#1e1e1e;border:1px solid #333;border-radius:18px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 8px 0}
label{display:block;font-size:13px;opacity:.8;margin:12px 0 4px}
.small{font-size:13px;opacity:.7;line-height:1.5}
.big{font-size:32px;font-weight:900;margin:4px 0}
.btn{width:100%;background:#d4ff3f;color:#000;border:0;padding:13px;border-radius:99px;font-weight:900;font-size:15px;cursor:pointer;margin-top:10px}
.btn2{width:100%;background:#222;color:#fff;border:1px solid #444;padding:12px;border-radius:99px;font-weight:800;font-size:14px;cursor:pointer;margin-top:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:900}
.badge.pending{background:#332a00;color:#ffcc00}
.badge.approved{background:#1a2e1a;color:#d4ff3f}
.badge.rejected{background:#331111;color:#ff6b6b}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex;justify-content:space-around;padding:10px 0}
.bottomnav a{color:#fff;text-decoration:none;font-size:11px;font-weight:700;text-align:center;opacity:.65;line-height:1.3}
.bottomnav a.active{color:#d4ff3f;opacity:1}
</style>
</head>
<body>
<header>MAROTHOLI LES-POT<small>💰 Wallet • 1G = M10</small></header>
<div class="wrap">
<div class="card"><h3>💰 My Grinds</h3><p class="big" id="bal">Loading...</p><p class="small" id="balM"></p><p class="small" id="pendingInfo"></p><button class="btn" onclick="location.href='deposit.html'">＋ Deposit Grinds</button><button class="btn2" onclick="location.href='withdraw.html'">Withdraw Royalties (Min 3.5G)</button><button class="btn2" onclick="loadWallet()">🔄 Refresh</button></div>
<div class="card"><h3>🎤 My Artist Earnings (63%)</h3><p class="small" id="earnings">Loading...</p><p class="small">You get 63% of every sale. Platform 23%. Fees 14%.</p></div>
<div class="card"><h3>📋 Recent Deposits</h3><div id="deposits"><p class="small">Loading...</p></div></div>
<div class="card"><h3>📋 Recent Withdrawals</h3><div id="withdrawals"><p class="small">Loading...</p></div></div>
<div class="card"><h3>📋 My Purchases</h3><div id="purchases"><p class="small">Loading...</p></div></div>
</div>
<div class="bottomnav"><a href="index.html">🏠<br>Home</a><a href="discover.html">🎵<br>Discover</a><a href="library.html">📚<br>Library</a><a href="upload.html">⬆️<br>Upload</a><a href="wallet.html" class="active">💰<br>Wallet</a><a href="account.html">👤<br>Account</a></div>
<script>
function statusBadge(status){
  const s = String(status || 'pending').toLowerCase();
  const cls = s === 'approved' ? 'approved' : (s === 'rejected' || s === 'declined' ? 'rejected' : 'pending');
  return "<span class='badge " + cls + "'>" + escHtml(s.toUpperCase()) + "</span>";
}
function fmtDate(d){
  try{ return new Date(d).toLocaleDateString('en-LS', {day:'numeric', month:'short'}); }catch(e){ return ''; }
}
async function loadWallet(){
  const user = await getCurrentUser();
  if(!user){
    document.getElementById('bal').textContent = 'Login needed';
    document.getElementById('earnings').textContent = 'Login to see earnings.';
    document.getElementById('deposits').innerHTML = "<p class='small'>Login to see deposits.</p>";
    document.getElementById('withdrawals').innerHTML = "<p class='small'>Login to see withdrawals.</p>";
    document.getElementById('purchases').innerHTML = "<p class='small'>Login to see purchases.</p>";
    return;
  }
  // 1. BALANCE - never let this block
  try{
    const {data:prof, error} = await window.sb.from('profiles').select('balance_grind').eq('id', user.id).single();
    if(error) throw error;
    const bal = Number(prof?.balance_grind || 0);
    document.getElementById('bal').textContent = bal.toFixed(2) + " G";
    document.getElementById('balM').textContent = "= M" + grindToMaloti(bal) + " • 1G = M10 FIXED • Available to spend / withdraw NOW";
  }catch(e){
    document.getElementById('bal').textContent = 'Error';
    document.getElementById('balM').textContent = e.message;
  }
  // 2. EARNINGS - try user_id, then artist_id
  try{
    let ids = [];
    let r1 = await window.sb.from('songs').select('id').eq('user_id', user.id);
    if(!r1.error && r1.data && r1.data.length) ids = r1.data.map(function(s){return s.id;});
    else {
      let r2 = await window.sb.from('songs').select('id').eq('artist_id', user.id);
      if(!r2.error && r2.data) ids = r2.data.map(function(s){return s.id;});
    }
    let totalSales = 0, count = 0;
    if(ids.length){
      const {data:p, error} = await window.sb.from('purchases').select('price_grind').in('song_id', ids);
      if(error) throw error;
      (p||[]).forEach(function(x){ totalSales += Number(x.price_grind||0); count++; });
    }
    const myCut = totalSales * 0.63;
    document.getElementById('earnings').innerHTML = "Sold: " + count + " songs • Total sales: " + totalSales.toFixed(2) + " G<br>Your 63% ALL-TIME: <b style='color:#d4ff3f'>" + myCut.toFixed(2) + " G = M" + grindToMaloti(myCut) + "</b><br><span style='opacity:.7'>⚠️ This is total ever earned - it is ALREADY in your Balance above. Do NOT add them together.</span><br>Min withdraw: 3.5G = M35";
  }catch(e){
    document.getElementById('earnings').textContent = "Could not load earnings: " + e.message;
  }
  // 3. DEPOSITS
  try{
    const {data:deps, error} = await window.sb.from('deposits').select('*').eq('user_id', user.id).order('created_at',{ascending:false}).limit(5);
    if(error) throw error;
    const pending = (deps||[]).filter(function(d){ return String(d.status||'').toLowerCase() === 'pending'; }).reduce(function(sum,d){ return sum + Number(d.amount_grind||d.amount||0); }, 0);
    document.getElementById('pendingInfo').textContent = pending > 0 ? "⏳ Pending deposits: " + pending.toFixed(2) + " G - will appear in Balance after Admin approves." : "";
    document.getElementById('deposits').innerHTML = !deps || !deps.length ? "<p class='small'>No deposits yet.</p>" : deps.map(function(d){ return "<div style='border-bottom:1px solid #333;padding:6px 0'><b>" + Number(d.amount_grind||d.amount||0).toFixed(2) + " G</b> • " + escHtml(d.method||'') + " • " + statusBadge(d.status) + " <span class='small'>" + fmtDate(d.created_at) + "</span></div>"; }).join('');
  }catch(e){
    document.getElementById('deposits').innerHTML = "<p class='small'>Could not load deposits: " + escHtml(e.message) + "</p>";
  }
  // 4. WITHDRAWALS
  try{
    const {data:wds, error} = await window.sb.from('withdrawals').select('*').eq('user_id', user.id).order('created_at',{ascending:false}).limit(5);
    if(error) throw error;
    document.getElementById('withdrawals').innerHTML = !wds || !wds.length ? "<p class='small'>No withdrawals yet.</p>" : wds.map(function(w){ return "<div style='border-bottom:1px solid #333;padding:6px 0'><b>" + Number(w.amount_grind||w.amount||0).toFixed(2) + " G</b> • " + escHtml(w.method||'') + " • " + statusBadge(w.status) + " <span class='small'>" + fmtDate(w.created_at) + "</span></div>"; }).join('');
  }catch(e){
    document.getElementById('withdrawals').innerHTML = "<p class='small'>Could not load withdrawals: " + escHtml(e.message) + "</p>";
  }
  // 5. PURCHASES
  try{
    const {data:purs, error} = await window.sb.from('purchases').select('*, songs(title)').eq('buyer_id', user.id).order('created_at',{ascending:false}).limit(5);
    if(error) throw error;
    document.getElementById('purchases').innerHTML = !purs || !purs.length ? "<p class='small'>No purchases yet.</p>" : purs.map(function(p){ return "<div style='border-bottom:1px solid #333;padding:6px 0'><b>" + escHtml(p.songs?.title||p.song_title||'Song') + "</b> • " + Number(p.price_grind||0).toFixed(2) + " G <span class='small'>" + fmtDate(p.created_at) + "</span></div>"; }).join('');
  }catch(e){
    document.getElementById('purchases').innerHTML = "<p class='small'>Could not load purchases: " + escHtml(e.message) + "</p>";
  }
}
document.addEventListener('DOMContentLoaded', loadWallet);
</script>
<script src="player.js"></script>
</body>
</html>
