<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload - Marotholi Les-Pot</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8ff00">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</head>
<body>
<div class="topbar"><div class="logo">MAROTHOLI <span>LES-POT</span></div><a class="badge" href="wallet.html" id="topBal">0 Grinds</a></div>
<div class="wrap">
  <div class="card"><h2>⬆️ Upload Song</h2><p class="small" style="margin-top:6px">Paste Catbox / audio link. Fans pay Grinds to unlock full song. You earn.</p>
    <label>Song Title *</label><input id="title" placeholder="e.g. Kea Rata">
    <label>Artist Name *</label><input id="artist" placeholder="Your artist name">
    <label>Genre</label><select id="genre"><option>Amapiano</option><option>Hip Hop</option><option>Afrobeat</option><option>Gospel</option><option>Sesotho Traditional</option><option>R&B</option><option>House</option><option>Other</option></select>
    <label>Price in Grinds (1 Grind = M10) *</label><input id="price" type="number" min="1" value="1" placeholder="1">
    <label>Audio Link (Catbox / direct mp3) *</label><input id="audio" placeholder="https://files.catbox.moe/xxxx.mp3">
    <label>Cover Image Link (optional)</label><input id="cover" placeholder="https://...jpg">
    <button id="upBtn" onclick="doUpload()">Upload Song →</button>
    <p class="small center" style="margin-top:10px" id="upMsg"></p>
  </div>
  <div class="card"><h3>🎵 My Uploads</h3><div id="myUploads" style="margin-top:10px">Loading...</div></div>
</div>
<nav class="bottomnav"><a href="index.html">🏠<br>Home</a><a href="discover.html">🎵<br>Discover</a><a href="wallet.html">👛<br>Wallet</a><a href="upload.html" class="active">⬆️<br>Upload</a><a href="auth.html">👤<br>Account</a></nav>
<script>
const U="https://mmkxiniybctmgoozaecp.supabase.co"; const K="sb_publishable_wWhjXCZ4JWfGlCIG95kzPg_WXqzfVDP";
if(!window.sb && window.supabase) window.sb=window.supabase.createClient(U,K);
async function doUpload(){
  const {user}=await getMyProfile();
  if(!user){ alert('Log in first'); location.href='auth.html'; return; }
  const title=document.getElementById('title').value.trim(), artist=document.getElementById('artist').value.trim(), genre=document.getElementById('genre').value, price=parseInt(document.getElementById('price').value)||1, audio=document.getElementById('audio').value.trim(), cover=document.getElementById('cover').value.trim();
  if(!title||!artist||!audio) return alert('Fill Title, Artist, Audio Link');
  const btn=document.getElementById('upBtn'); btn.disabled=true; btn.textContent='Uploading...';
  const {error}=await sb.from('songs').insert([{title,artist,genre,price_grinds:price,audio_url:audio,cover_url:cover,uploader_id:user.id}]);
  if(error){ alert(error.message); btn.disabled=false; btn.textContent='Upload Song →'; return; }
  alert('✅ Uploaded! Now in Discover.'); location.href='discover.html';
}
document.addEventListener('DOMContentLoaded', async ()=>{
  const {user,profile}=await getMyProfile();
  if(profile) document.getElementById('topBal').textContent=(profile.grind_balance||0)+' Grinds';
  if(!user){ document.getElementById('myUploads').innerHTML='Log in to see uploads'; return; }
  const {data}=await sb.from('songs').select('*').eq('uploader_id',user.id).order('created_at',{ascending:false});
  document.getElementById('myUploads').innerHTML=!data||!data.length?'No uploads yet':data.map(s=>`<div style="border-bottom:1px solid #222;padding:10px 0;font-size:13px"><b>${s.title}</b> - ${s.artist} - ${s.price_grinds}G</div>`).join('');
});
</script>
</body>
</html>
