<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload - Marotholi Les-Pot</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  header{background:#d4ff3f;color:#000;padding:14px;text-align:center;font-weight:900;font-size:18px}
  .wrap{max-width:500px;margin:0 auto;padding:16px}
  .back{display:block;text-align:center;color:#fff;opacity:.7;margin-top:14px;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<header>MAROTHOLI LES-POT — UPLOAD</header>
<div class="wrap">
  <div class="card">
    <h3>⬆️ Upload Your Song</h3>
    <p class="small">MP3 only, max 15MB. You earn 63% on every sale. 1G = M10.</p>
    <label>Song Title</label>
    <input id="title" placeholder="e.g. Test">
    <label>Artist Name</label>
    <input id="artist" placeholder="e.g. FlackoBird">
    <label>Price in Grind (G) — e.g. 0.2 = M2</label>
    <input id="price" type="number" step="0.01" min="0.1" placeholder="0.2">
    <label>Cover Image (optional - JPG/PNG, max 2MB)</label>
    <input id="cover" type="file" accept="image/*">
    <label>Audio File — MP3</label>
    <input id="audio" type="file" accept="audio/*,.mp3">
    <button id="btn" onclick="doUpload()">UPLOAD SONG →</button>
    <div id="msg" class="small center" style="margin-top:12px;white-space:pre-wrap"></div>
    <div id="progress" style="height:8px;background:#222;border-radius:99px;overflow:hidden;margin-top:10px;display:none"><div id="bar" style="height:100%;width:0%;background:linear-gradient(90deg,#d4ff3f,#00ff88);transition:.3s"></div></div>
  </div>
  <a class="back" href="discover.html">← Back to Discover</a>
</div>
<div class="bottomnav"><a href="discover.html">🔥 Discover</a><a href="library.html">📚 Library</a><a href="upload.html" class="active">⬆️ Upload</a><a href="wallet.html">💰 Wallet</a><a href="admin.html">🛠️ Admin</a><a href="account.html">👤 Account</a></div>

<script>
(async ()=>{
  const {data:{user}} = await sb.auth.getUser();
  if(user){
    const {data:p} = await sb.from('profiles').select('full_name').eq('id', user.id).single();
    if(p?.full_name) document.getElementById('artist').value = p.full_name;
  }
})();

async function doUpload(){
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  const bar = document.getElementById('bar');
  const prog = document.getElementById('progress');
  const say = (t)=> msg.textContent = t;

  const title = document.getElementById('title').value.trim();
  const artist = document.getElementById('artist').value.trim();
  const priceVal = document.getElementById('price').value;
  const audioFile = document.getElementById('audio').files[0];
  const coverFile = document.getElementById('cover').files[0];

  if(!title || !artist){ say("Fill title + artist"); return; }
  if(!audioFile){ say("Pick an MP3 file first"); return; }
  if(!audioFile.name.toLowerCase().endsWith('.mp3')){
    say("❌ Please pick a .mp3 file, not " + audioFile.name);
    return;
  }
  if(audioFile.size > 15*1024*1024){ say("❌ MP3 too big, max 15MB"); return; }
  if(coverFile && coverFile.size > 2*1024*1024){ say("❌ Cover too big, max 2MB"); return; }
  if(!priceVal || Number(priceVal) < 0.1){ say("Enter price min 0.1 G"); return; }

  btn.disabled = true;
  prog.style.display='block'; bar.style.width='10%';
  say("Checking login...");
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ say("Not logged in. Go to auth.html first."); btn.disabled=false; prog.style.display='none'; return; }

  try{
    say("Uploading audio... please wait, do not close.");
    bar.style.width='40%';
    const cleanName = audioFile.name.replace(/[^a-zA-Z0-9.-]/g,'_');
    const audioPath = user.id + "/" + Date.now() + "_" + cleanName;
    const { error: upErr } = await sb.storage.from('songs').upload(audioPath, audioFile);
    if(upErr) throw new Error("Storage upload failed: " + upErr.message + "\nCheck: Supabase > Storage > songs bucket exists and is PUBLIC.");

    let coverUrl = null;
    if(coverFile){
      bar.style.width='65%';
      say("Uploading cover...");
      const cName = coverFile.name.replace(/[^a-zA-Z0-9.-]/g,'_');
      const coverPath = user.id + "/" + Date.now() + "_cover_" + cName;
      const { error: cErr } = await sb.storage.from('covers').upload(coverPath, coverFile);
      if(!cErr){
        const {data:pub} = sb.storage.from('covers').getPublicUrl(coverPath);
        coverUrl = pub.publicUrl;
      } else {
        const { error: cErr2 } = await sb.storage.from('songs').upload(coverPath, coverFile);
        if(!cErr2){ const {data:pub2} = sb.storage.from('songs').getPublicUrl(coverPath); coverUrl = pub2.publicUrl; }
      }
    }

    bar.style.width='85%';
    say("Saving song info...");
    const priceNum = parseFloat(priceVal);
    // ✅ FIXED BY TAURENTH: DO NOT SEND price_maloti - Supabase calculates it. Sending it broke every upload.
    const { error: dbErr } = await sb.from('songs').insert({
      title: title,
      artist_name: artist,
      artist_id: user.id,
      audio_path: audioPath,
      cover_url: coverUrl,
      price_grind: priceNum,
      total_buys: 0,
      preview_start: 0
    });
    if(dbErr) throw dbErr;

    bar.style.width='100%';
    say("✅ UPLOADED! Go to Discover to see it.");
    setTimeout(()=> location.href = 'discover.html', 1200);

  }catch(e){
    console.error(e);
    say("FAILED: " + e.message);
    btn.disabled = false;
    prog.style.display='none';
  }
}
</script>
</body></html>
