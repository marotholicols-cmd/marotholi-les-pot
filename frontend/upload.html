<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload — Marotholi Les-Pot</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="topbar"><div class="logo">MAROTHOLI <span>LES-POT</span></div><span class="badge">📤 UPLOAD</span></div>
<div class="wrap"><div class="card"><h2>Upload Your Song</h2><p>Earn royalties. 1 Grind = M10. Withdraw to EcoCash / Postbank or VISA / M-Pesa.</p>
<label>Song Title</label><input id="title" placeholder="Song title">
<label>Artist Name</label><input id="artist" placeholder="Your artist name">
<label>Genre</label><select id="genre"><option>Amapiano</option><option>Hip Hop</option><option>Gospel</option><option>Afro</option><option>House</option><option>R&B</option><option>Traditional</option><option>Other</option></select>
<label>Price in Grinds (1-10)</label><input id="price" type="number" min="1" max="10" value="1"><p class="priceHint" id="priceHint">You get M10 per sale</p>
<label>Cover Image URL</label><input id="cover" placeholder="https://...">
<label>Audio URL (mp3)</label><input id="audio" placeholder="https://...mp3">
<label>Drop Date (optional)</label><input id="dropDate" type="date">
<div class="toggleRow"><button id="btnPublic" class="on" onclick="setVis('public')">🌍 Public</button><button id="btnPrivate" onclick="setVis('private')">🔒 Private</button></div>
<button onclick="submitUpload()" style="margin-top:14px">Upload Song</button><p id="msg" class="small center"></p>
</div></div>
<nav class="bottomnav"><a href="discover.html">🏠<br>Discover</a><a href="library.html">📚<br>Library</a><a href="wallet.html">💰<br>Wallet</a><a href="upload.html" class="active">📤<br>Upload</a><a href="account.html">👤<br>Account</a></nav>
<script>let VIS='public';function setVis(v){VIS=v;document.getElementById('btnPublic').classList.toggle('on',v==='public');document.getElementById('btnPrivate').classList.toggle('on',v==='private');}document.getElementById('price').addEventListener('input',e=>{document.getElementById('priceHint').textContent='You get M'+((parseFloat(e.target.value)||1)*10).toFixed(2)+' per sale';});function submitUpload(){document.getElementById('msg').textContent='✅ Upload saved (connect Supabase in app.js to go live).';}</script>
</body>
</html>
