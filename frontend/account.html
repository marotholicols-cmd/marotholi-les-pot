<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account - Marotholi Les-Pot</title>
<link rel="icon" href="icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
body{background:#0f0f0f;color:#fff;font-family:system-ui,sans-serif;margin:0;padding-bottom:110px}
header{background:#d4ff3f;color:#000;padding:14px;text-align:center;font-weight:900;font-size:18px}
header small{display:block;font-size:12px;font-weight:700;opacity:.7}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.card{background:#1e1e1e;border:1px solid #333;border-radius:18px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;opacity:.8;margin:12px 0 4px}
input,select{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;font-size:15px}
.btn{width:100%;background:#d4ff3f;color:#000;border:0;padding:13px;border-radius:99px;font-weight:900;font-size:15px;cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.5}
.small{font-size:13px;opacity:.7;line-height:1.5}
.msg{margin-top:10px;font-size:14px;min-height:20px}.msg.error{color:#ff6b6b}.msg.ok{color:#d4ff3f}
.tabs{display:flex;gap:8px}.tabs button{flex:1;padding:12px;border-radius:99px;border:1px solid #444;background:#222;color:#fff;font-weight:800;cursor:pointer}.tabs button.active{background:#d4ff3f;color:#000}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex;justify-content:space-around;padding:10px 0}
.bottomnav a{color:#fff;text-decoration:none;font-size:11px;font-weight:700;text-align:center;opacity:.65}.bottomnav a.active{color:#d4ff3f;opacity:1}
</style>
</head>
<body>
<header>MAROTHOLI LES-POT<small>🐂 🌧️ Lesotho Music • 1G = M10 FIXED</small></header>
<div class="wrap">
<div class="card" id="statusCard"><h3>👤 My Account</h3><p class="small" id="statusText">Checking...</p><div id="loggedInBox" style="display:none"><p class="small" id="userInfo"></p><p style="font-size:22px;font-weight:900" id="balText"></p><button class="btn" onclick="doLogout()">Logout</button></div></div>
<div class="card" id="authCard">
<div class="tabs"><button id="tabLogin" class="active" onclick="switchTab('login')">Login</button><button id="tabSignup" onclick="switchTab('signup')">Sign Up</button></div>
<div id="loginForm"><label>Email</label><input id="loginEmail" type="email" placeholder="you@gmail.com"><label>Password</label><input id="loginPass" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">Login →</button><p class="small" style="text-align:center;margin-top:10px"><a href="#" onclick="doForgot();return false;" style="color:#d4ff3f">Forgot password?</a></p></div>
<div id="signupForm" style="display:none"><label>Stage Name / Username</label><input id="suName" placeholder="e.g. Flackobird1"><label>Email</label><input id="suEmail" type="email" placeholder="you@gmail.com"><label>Password</label><input id="suPass" type="password" placeholder="Min 6 characters"><label>Are you an Artist?</label><select id="suRole"><option value="fan">Fan - I buy & listen</option><option value="artist">Artist - I upload & sell</option></select><button class="btn" id="signupBtn" onclick="doSignup()">Create Account →</button><p class="small">By signing up you agree: No download, stream only. Preview 30 sec. Artist gets 63%.</p></div>
<p class="msg" id="msg"></p></div>
</div>
<div class="bottomnav"><a href="index.html">🏠<br>Home</a><a href="discover.html">🎵<br>Discover</a><a href="library.html">📚<br>Library</a><a href="upload.html">⬆️<br>Upload</a><a href="wallet.html">💰<br>Wallet</a><a href="account.html" class="active">👤<br>Account</a></div>
<script>
let mode='login';
function getClient(){ if(window.sb) return window.sb; if(typeof initSB==='function'){ try{ const c=initSB(); if(c) return c; }catch(e){} } return window.sb||null; }
function switchTab(m){ mode=m; document.getElementById('tabLogin').classList.toggle('active',m==='login'); document.getElementById('tabSignup').classList.toggle('active',m==='signup'); document.getElementById('loginForm').style.display=m==='login'?'block':'none'; document.getElementById('signupForm').style.display=m==='signup'?'block':'none'; document.getElementById('msg').textContent=''; }
function showMsg(t,ok){ const el=document.getElementById('msg'); el.textContent=t; el.className='msg '+(ok?'ok':'error'); }
async function waitForSB(){ for(let i=0;i<10;i++){ const c=getClient(); if(c&&c.auth) return c; await new Promise(r=>setTimeout(r,500)); } return null; }
async function checkLogin(){
  const c=await waitForSB();
  if(!c){ document.getElementById('statusText').textContent='Still connecting to Supabase... reload page'; return; }
  const {data}=await c.auth.getUser();
  if(!data?.user){ document.getElementById('statusText').textContent='Not logged in - Login or Sign Up below'; return; }
  document.getElementById('statusText').textContent='Logged in ✅';
  document.getElementById('loggedInBox').style.display='block';
  document.getElementById('authCard').style.display='none';
  document.getElementById('userInfo').textContent=data.user.email;
  try{ const {data:prof}=await c.from('profiles').select('grind_balance').eq('id',data.user.id).single(); if(prof) document.getElementById('balText').textContent=Number(prof.grind_balance||0).toFixed(2)+' G = M'+(Number(prof.grind_balance||0)*10).toFixed(2); }catch(e){}
}
async function doSignup(){
  const name=document.getElementById('suName').value.trim();
  const email=document.getElementById('suEmail').value.trim();
  const pass=document.getElementById('suPass').value;
  const role=document.getElementById('suRole').value;
  if(!name||!email||!pass){ showMsg('Fill name, email and password'); return; }
  if(pass.length<6){ showMsg('Password must be 6+ characters'); return; }
  const btn=document.getElementById('signupBtn'); btn.disabled=true; showMsg('Connecting...',true);
  const c=await waitForSB();
  if(!c){ showMsg('Still not connected. Check internet and reload.'); btn.disabled=false; return; }
  try{
    showMsg('Creating account...',true);
    const {data,error}=await c.auth.signUp({email,password:pass});
    if(error) throw error;
    const user=data?.user;
    if(user){ const {error:pErr}=await c.from('profiles').upsert({id:user.id,username:name,email:email,role:role,grind_balance:0}); if(pErr) console.log(pErr.message); }
    showMsg('✅ Account created! Check your email to confirm, then Login.',true);
    setTimeout(()=>switchTab('login'),1000);
  }catch(e){ showMsg('❌ '+e.message); } finally{ btn.disabled=false; }
}
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  if(!email||!pass){ showMsg('Fill email and password'); return; }
  showMsg('Logging in...',true);
  const c=await waitForSB(); if(!c){ showMsg('Still not connected. Reload.'); return; }
  const {data,error}=await c.auth.signInWithPassword({email,password:pass});
  if(error){ showMsg('❌ '+error.message); return; }
  showMsg('✅ Logged in! Going Home...',true);
  setTimeout(()=>location.href='index.html',800);
}
async function doForgot(){
  const email=document.getElementById('loginEmail').value.trim();
  if(!email){ showMsg('Type your email in Login Email first'); return; }
  const c=await waitForSB(); if(!c){ showMsg('Still not connected. Reload.'); return; }
  const {error}=await c.auth.resetPasswordForEmail(email,{redirectTo: location.origin+'/account.html'});
  if(error) showMsg('❌ '+error.message); else showMsg('✅ Reset link sent to '+email+' - check Spam too',true);
}
async function doLogout(){ const c=await waitForSB(); if(c) await c.auth.signOut(); location.reload(); }
document.addEventListener('DOMContentLoaded', checkLogin);
</script>
</body>
</html>
