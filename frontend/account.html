<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — Marotholi Les-Pot</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="topbar"><div class="logo">MAROTHOLI <span>LES-POT</span></div><span class="badge">👤 ACCOUNT</span></div>
<div class="wrap"><div class="card center"><h2 id="userName">Guest</h2><p id="userEmail">Login to see your royalties</p><div class="statRow"><div class="statBox"><b id="accBal">0</b><div>Grinds</div></div><div class="statBox"><b id="accSongs">0</b><div>Songs</div></div></div></div>
<div class="card"><h3>Withdrawal Preference</h3><p>Where do you want your royalties? M-Pesa allowed.</p><select id="prefMethod"><option>EcoCash</option><option>Postbank</option><option>Mpesa</option></select><input id="prefNumber" placeholder="Your M-Pesa / EcoCash number / Postbank account"><button onclick="savePref()">Save Preference</button><p id="prefMsg" class="small center"></p></div>
<div class="card"><a href="auth.html"><button class="ghost">Login / Register</button></a><br><br><button class="danger" onclick="logout()">Logout</button></div></div>
<nav class="bottomnav"><a href="discover.html">🏠<br>Discover</a><a href="library.html">📚<br>Library</a><a href="wallet.html">💰<br>Wallet</a><a href="upload.html">📤<br>Upload</a><a href="account.html" class="active">👤<br>Account</a></nav>
<script>function savePref(){document.getElementById('prefMsg').textContent='✅ Saved: '+document.getElementById('prefMethod').value+' - '+document.getElementById('prefNumber').value;}function logout(){alert('Logged out');location.href='auth.html';}</script>
</body>
</html>
