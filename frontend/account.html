<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account - Marotholi Les-Pot</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
    * { box-sizing: border-box; }
  body { background: #0f0f0f; color: #fff; font-family: system-ui, sans-serif; margin: 0; padding-bottom: 110px; }
  header { background: #d4ff3f; color: #000; padding: 14px; text-align: center; font-weight: 900; font-size: 18px; position: sticky; top: 0; z-index: 50; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px; }
  .card { background: #1e1e1e; border: 1px solid #333; border-radius: 18px; padding: 14px; margin-bottom: 12px; }
  .profile-head { text-align: center; padding: 16px 0 6px; }
  .avatar { width: 80px; height: 80px; border-radius: 99px; background: linear-gradient(135deg, #ff2ea6, #d4ff3f); display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 0 auto 10px; }
  label { display: block; font-size: 14px; opacity: .8; margin: 10px 0 4px; }
  input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #333; background: #111; color: #fff; font-size: 15px; }
  .small { font-size: 13px; opacity: .7; line-height: 1.5; }
  .btn { width: 100%; background: #d4ff3f; color: #000; border: 0; padding: 13px; border-radius: 99px; font-weight: 900; cursor: pointer; margin-top: 10px; }
  .btn-dark { width: 100%; background: #222; color: #fff; border: 1px solid #444; padding: 11px; border-radius: 99px; font-weight: 800; cursor: pointer; margin-top: 8px; }
  .btn-red { width: 100%; background: #ff4444; color: #fff; border: 0; padding: 11px; border-radius: 99px; font-weight: 900; cursor: pointer; margin-top: 8px; }
  .bottomnav { position: fixed; bottom: 0; left: 0; right: 0; background: #111; border-top: 1px solid #333; display: flex; justify-content: space-around; padding: 10px 0; z-index: 50; }
  .bottomnav a { color: #fff; text-decoration: none; font-size: 12px; font-weight: 700; text-align: center; opacity: .7; padding: 6px; }
  .bottomnav a.active { color: #d4ff3f; opacity: 1; }
</style>
</head>
<body>
<header>MAROTHOLI LES-POT — ACCOUNT</header>
<div class="wrap">
  <div class="profile-head">
    <div class="avatar" id="avatar">👤</div>
    <h2 id="accName" style="margin:0">Loading...</h2>
    <p class="small" id="accEmail"></p>
    <p style="font-weight:900;color:#d4ff3f" id="accBal">0.00 G</p>
  </div>
  <div class="card">
    <h3 style="margin:0">✏️ Edit Profile</h3>
    <label>Username / Artist Name</label>
    <input id="editUsername" placeholder="Your name">
    <button class="btn" onclick="saveProfile()">SAVE PROFILE →</button>
    <p id="saveMsg" class="small center"></p>
  </div>
  <div class="card">
    <h3 style="margin:0">📊 My Stats</h3>
    <p class="small" id="myStats">Loading...</p>
    <button class="btn-dark" onclick="location.href='library.html'">📚 My Bought Songs</button>
    <button class="btn-dark" onclick="location.href='upload.html'">⬆️ My Uploads</button>
    <button class="btn-dark" onclick="location.href='wallet.html'">💰 My Wallet</button>
  </div>
  <div class="card">
    <h3 style="margin:0">🔗 Share App</h3>
    <p class="small">Share Marotholi Les-Pot with friends — they buy your music, you get 63%.</p>
    <button class="btn-dark" onclick="shareApp()">🔗 Copy App Link</button>
  </div>
  <button class="btn-red" onclick="signOut()">🚪 Logout</button>
</div>
<div class="bottomnav">
  <a href="discover.html">🔥<br>Discover</a>
  <a href="library.html">📚<br>Library</a>
  <a href="upload.html">⬆️<br>Upload</a>
  <a href="wallet.html">💰<br>Wallet</a>
  <a href="admin.html">🛠️<br>Admin</a>
  <a href="account.html" class="active">👤<br>Account</a>
</div>
<script>
  async function loadAccount() {
    const { user, profile } = await getMyProfile();
    if (!user) { location.href = 'auth.html'; return; }
    document.getElementById('accName').textContent = profile?.username || user.email;
    document.getElementById('accEmail').textContent = user.email;
    document.getElementById('accBal').textContent = Number(profile?.grind_balance || 0).toFixed(2) + ' G = M' + (Number(profile?.grind_balance || 0) * 10).toFixed(2);
    document.getElementById('editUsername').value = profile?.username || '';
    document.getElementById('avatar').textContent = (profile?.username || 'U').charAt(0).toUpperCase();
    const { data: buys } = await window.sb.from('purchases').select('id').eq('fan_id', user.id).eq('status', 'approved');
    const { data: songs } = await window.sb.from('songs').select('id, total_buys').eq('artist_id', user.id);
    const totalSales = (songs || []).reduce(function (s, x) { return s + Number(x.total_buys || 0); }, 0);
    document.getElementById('myStats').innerHTML = 'Bought: <b>' + (buys || []).length + ' songs</b><br>Uploaded: <b>' + (songs || []).length + ' songs</b><br>Total sales of your songs: <b>' + totalSales + '</b>';
  }
  async function saveProfile() {
    const name = document.getElementById('editUsername').value.trim();
    if (!name) return;
    const { data: { user } } = await window.sb.auth.getUser();
    const { error } = await window.sb.from('profiles').update({ username: name }).eq('id', user.id);
    if (error) { document.getElementById('saveMsg').textContent = error.message; return; }
    document.getElementById('saveMsg').textContent = '✅ Saved!';
    loadAccount();
  }
  function shareApp() {
    const url = location.origin + '/discover.html';
    navigator.clipboard.writeText('🔥 Marotholi Les-Pot - Lesotho Music App ' + url).then(function () { alert('🔗 App link copied!'); });
  }
  document.addEventListener('DOMContentLoaded', loadAccount);
</script>
</body>
</html>
